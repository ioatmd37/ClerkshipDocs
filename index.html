<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ฝึก Refer/Consent">
<meta name="theme-color" content="#FFFFFF">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>ฝึกใบส่งตัวและใบยินยอม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sarabun:wght@400;500;600;700&family=Sriracha&display=swap">
<style>
/* Layout: A4 sheets laid on a desk. Printed text is black Sarabun (the Thai official-document face),
   what the student writes is ballpoint blue, and every mark the grader makes is red pen (Sriracha). */
:root{
  --desk:#E1E3E0; --paper:#FFFFFF; --paper-2:#F5F6F4;
  --ink:#141414; --ink-2:#444443; --ink-3:#7A7A77;
  --line:#141414; --hair:#D0D1CE; --dots:#8A8A86;
  --pen:#1C3E99; --red:#B3261E; --red-soft:#FBECEB;
  --shadow:0 1px 1px rgba(0,0,0,.06),0 12px 30px -16px rgba(0,0,0,.3);
  --doc:"Sarabun","Thonburi",-apple-system,system-ui,sans-serif;
  --hand:"Sriracha","Sarabun",cursive;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --lh:2.2rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101010; --paper:#1C1C1B; --paper-2:#232322;
  --ink:#EAE8E3; --ink-2:#BAB7B1; --ink-3:#8B8882;
  --line:#D6D3CC; --hair:#3B3A37; --dots:#75736E;
  --pen:#9AB8FF; --red:#FF857C; --red-soft:#3B201E;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.85);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#101010; --paper:#1C1C1B; --paper-2:#232322;
  --ink:#EAE8E3; --ink-2:#BAB7B1; --ink-3:#8B8882;
  --line:#D6D3CC; --hair:#3B3A37; --dots:#75736E;
  --pen:#9AB8FF; --red:#FF857C; --red-soft:#3B201E;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.85);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--doc);font-size:18px;line-height:1.7;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hand{font-family:var(--hand);color:var(--red)}
.muted{color:var(--ink-3);font-size:.92rem}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- app frame ---------- */
.app{height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:3px double var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;cursor:pointer;font-weight:700;font-size:1.02rem}
.brand-mark{width:30px;height:30px;border:1.5px solid var(--line);display:grid;place-items:center}
.crumb{color:var(--ink-2);font-size:.98rem}
.crumb::before{content:"›";margin-right:12px;color:var(--ink-3)}
.bar-tools{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.85rem;padding:3px 10px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;color:var(--ink-2);cursor:pointer;min-height:36px}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);position:relative;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{transform:translateX(16px);background:var(--paper)}
main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:.35em 1.1em;border-radius:3px;min-height:44px;cursor:pointer;font-family:var(--doc);font-weight:600;font-size:1rem;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:var(--hair)}
.btn.sm{min-height:36px;font-size:.9rem;padding:.15em .8em}
.btn.lg{min-height:52px;font-size:1.08rem;padding:.45em 1.6em}
.btn[data-armed]{border-color:var(--red);color:var(--red)}
.linkbtn{background:none;border:0;padding:0;color:var(--pen);text-decoration:underline;cursor:pointer;font-size:inherit}

/* ---------- sheets ---------- */
.deskwrap{padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.sheet{position:relative;width:100%;max-width:900px;margin:0 auto;background:var(--paper);box-shadow:var(--shadow);padding:clamp(22px,5vw,56px) clamp(18px,5.5vw,64px);display:flex;flex-direction:column;gap:18px}
.sheet.wide{max-width:1180px}
.sheet.mini{padding:18px 20px;gap:10px}
.pageno{text-align:center;color:var(--ink-2);margin-top:-8px}
.doc-title{font-size:clamp(1.35rem,3vw,1.7rem);text-align:center}
.doc-h{font-size:1.15rem}
.stamp{position:absolute;top:clamp(14px,3vw,26px);right:clamp(14px,3vw,26px);color:var(--red);border:2.5px solid var(--red);border-radius:4px;padding:0 10px;font-weight:700;letter-spacing:.08em;transform:rotate(-7deg);opacity:.85;font-size:.95rem;pointer-events:none;line-height:1.7}
.vstamp{display:inline-block;color:var(--red);border:2.5px solid var(--red);border-radius:4px;padding:0 12px;font-weight:700;letter-spacing:.06em;transform:rotate(-4deg);line-height:1.8;align-self:flex-start}
.vstamp.okay{color:var(--ink);border-color:var(--ink)}
.para{text-indent:2.5em}
.note{border:1px dashed var(--line);padding:10px 14px;background:var(--paper)}
.note b{font-weight:700;margin-right:6px}
.note.ok b{color:var(--ink)}
.note.bad b{color:var(--red)}

/* memo header (home) */
.memo-word{text-align:center;font-size:clamp(1.6rem,4vw,2rem);font-weight:700;letter-spacing:.02em}
.memo{display:flex;flex-direction:column;gap:6px;margin:0;padding-bottom:12px;border-bottom:1.5px solid var(--line)}
.memo .r{display:flex;gap:6px 24px;flex-wrap:wrap}
.memo .r > div{display:flex;gap:10px;align-items:baseline;flex:1 1 16rem;min-width:0}
.memo dt{font-weight:700;font-size:1.12rem;white-space:nowrap}
.memo dd{margin:0;flex:1;border-bottom:1px dotted var(--dots);min-width:0}

/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.doc{width:100%;border-collapse:collapse;font-size:1rem;min-width:520px}
table.doc th,table.doc td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
table.doc th{font-weight:700;background:var(--paper-2);text-align:center}
table.doc td.c{text-align:center;font-variant-numeric:tabular-nums}
table.doc .sub{display:block;color:var(--ink-2);font-size:.9rem}
table.doc .hand{font-size:1.25rem}

/* ---------- refer split ---------- */
.split{height:100%;display:grid;grid-template-columns:minmax(300px,5fr) minmax(0,7fr)}
.pane{min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.case{background:var(--paper);border-right:1.5px solid var(--line)}
.pane-head{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px 10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;border-bottom:1px solid var(--line)}
.pane-head h2{font-size:1.08rem}
.pane-head .lab-tag{font-size:.82rem;color:var(--ink-3);letter-spacing:.06em}
.case-body{padding-block:16px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;display:flex;flex-direction:column;gap:18px;font-size:1rem}
.only-narrow{display:none}
@media (max-width:999px){
  .split{display:flex;flex-direction:column}
  .case{flex:0 0 auto;max-height:44%;border-right:0;border-bottom:1.5px solid var(--line)}
  .case.collapsed .case-body{display:none}
  .work{flex:1 1 auto}
  .only-narrow{display:inline-flex}
  .pane-head,.case-body{padding-right:max(20px,env(safe-area-inset-right,0px))}
}
.task{border:1.5px solid var(--line);padding:10px 14px}
.task::before{content:"โจทย์  ";font-weight:700}
.case h3{font-size:1rem;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.case ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px}
.pi{display:flex;flex-direction:column;gap:6px}
.pi .when{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pe{display:grid;grid-template-columns:5.4rem 1fr;gap:2px 12px;margin:0}
.pe dt{font-weight:600}
.pe dd{margin:0}
.labgroup{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.labgroup > span{font-weight:600;font-size:.94rem}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.6rem,1fr));gap:0 16px}
.lab{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--dots);padding:2px 0;font-variant-numeric:tabular-nums;font-size:.95rem}
.lab span{color:var(--ink-3)}
.work{background:var(--desk)}
.work-inner{max-width:920px;margin:0 auto;padding-block:18px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* steps */
.steps{display:flex;gap:2px 6px;flex-wrap:wrap;list-style:none;margin:0;padding:0;align-items:center}
.steps li + li::before{content:"›";color:var(--ink-3);margin-right:6px}
.step{border:0;background:transparent;padding:6px 4px;color:var(--ink-3);font-size:.98rem;min-height:40px;cursor:pointer}
.step[aria-current="step"]{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}
.step.done{color:var(--ink-2)}
.step:disabled{cursor:default;opacity:.55}

/* form choice */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.choice{position:relative;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:0;padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:var(--shadow)}
.choice:hover{background:var(--paper-2)}
.choice .mini-title{font-weight:700;font-size:1.04rem;line-height:1.45;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.choice .mini-sub{font-size:.92rem;color:var(--ink-2)}
.choice .code{font-family:var(--mono);font-size:.78rem;color:var(--ink-3)}
.choice[aria-pressed="true"]::after{position:absolute;top:-14px;right:-8px;font-family:var(--hand);font-size:2.6rem;line-height:1;color:var(--red)}
.choice.right[aria-pressed="true"]::after{content:"✓"}
.choice.wrong[aria-pressed="true"]::after{content:"✕"}

/* ---------- paper form ---------- */
.frame{border:1.5px solid var(--line);padding:clamp(14px,3.2vw,30px);display:flex;flex-direction:column;gap:14px;font-size:1.04rem}
.form-title{text-align:center;font-weight:700;font-size:1.22rem}
.form-sub{text-align:center;color:var(--ink-3);font-size:.86rem;margin-top:-10px}
.frow{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:flex-end}
.fl{display:flex;align-items:baseline;gap:8px;min-width:0}
.frow > .fl{flex:1 1 var(--w,12rem)}
.fl > span{white-space:nowrap}
.dot{flex:1;min-width:3ch;width:100%;border:0;border-bottom:1.5px dotted var(--dots);background:transparent;color:var(--pen);font:inherit;font-size:1.06rem;padding:2px 4px;border-radius:0;-webkit-appearance:none}
.dot:focus{outline:none;border-bottom:1.5px solid var(--pen);background:color-mix(in srgb,var(--pen) 6%,transparent)}
.opts{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt .bx{width:22px;height:22px;border:1.5px solid var(--line);display:inline-grid;place-items:center;flex:none;background:var(--paper)}
.opt .bx.rd{border-radius:50%}
.opt input:checked + .bx::after{content:"✓";font-family:var(--hand);color:var(--pen);font-size:1.45rem;line-height:1;transform:translate(2px,-3px)}
.opt input:checked + .bx.rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pen);transform:none}
.opt input:focus-visible + .bx{outline:2px solid var(--pen);outline-offset:2px}
.opt input:checked ~ .ot{color:var(--pen)}
.sec{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap}
.sec-title{font-weight:600}
.sec-hint{font-size:.88rem;color:var(--ink-3)}
.mode{display:inline-flex;border:1px solid var(--line);font-size:.84rem}
.mode button{border:0;background:var(--paper);color:var(--ink-2);padding:2px 12px;min-height:32px;cursor:pointer}
.mode button + button{border-left:1px solid var(--line)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
textarea.ruled{display:block;width:100%;border:0;resize:none;overflow:hidden;font:inherit;font-size:1.06rem;color:var(--pen);line-height:var(--lh);background-color:transparent;background-image:radial-gradient(circle,var(--dots) .9px,transparent 1.3px);background-size:6px var(--lh);background-position:0 calc(var(--lh) / 2 - 3px);background-attachment:local;padding:0 4px;min-height:calc(var(--lh) * 3);border-radius:0}
textarea.ruled:focus{outline:none;background-color:color-mix(in srgb,var(--pen) 4%,transparent)}
.inkpad{display:flex;flex-direction:column;gap:6px}
.ink-surface{border:1px dashed var(--hair);background-image:radial-gradient(circle,var(--dots) .9px,transparent 1.3px);background-size:6px 38px;background-position:0 16px;overflow:hidden}
.ink-surface canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.sig .ink-surface{background-image:none;background-color:var(--paper-2)}
.ink-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ink-tools .muted{font-size:.82rem;margin-left:auto}
.form-foot{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-3)}
.sigblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 28px;align-items:start}
.sigcol{display:flex;flex-direction:column;gap:6px}
.sigcol > b{font-weight:600}
.submit-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* consent form header */
.c-head{display:grid;grid-template-columns:1fr 1.5fr 1.2fr;border:1.5px solid var(--line);font-size:.98rem}
.c-head > div{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.c-head > div + div{border-left:1.5px solid var(--line)}
.c-org{justify-content:space-between}
.c-org b{font-weight:700;line-height:1.4}
.c-org .formno{border-top:1.5px solid var(--line);margin:6px -12px -10px;padding:8px 12px;font-weight:700}
@media (max-width:760px){.c-head{grid-template-columns:1fr}.c-head > div + div{border-left:0;border-top:1.5px solid var(--line)}}
.c-title{text-align:center;font-weight:700;padding:8px 0;border-block:3px double var(--line)}
.mark{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
.markbox{border:1.5px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1 1 320px}
.prose{line-height:2.25}
.prose .dot{width:auto;display:inline-block;vertical-align:baseline}
.legal{color:var(--ink-2);line-height:1.9}
.frame details{border:1px dashed var(--line);padding:8px 12px}
.frame summary{cursor:pointer;font-weight:600;min-height:32px}

/* ---------- grading sheet ---------- */
.rhead{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;padding-bottom:18px;border-bottom:1.5px solid var(--line)}
.redscore{font-family:var(--hand);color:var(--red);font-size:2.8rem;line-height:1;padding:.18em .55em;border:2.5px solid var(--red);border-radius:50%;transform:rotate(-5deg);font-variant-numeric:tabular-nums;white-space:nowrap}
.redscore small{font-size:1.5rem}
.scoreinfo{display:flex;flex-direction:column;gap:6px;flex:1 1 240px;min-width:0}
.rhead .row{margin-left:auto}
.grade{border:1.5px solid var(--line)}
.grade-head,.g-row summary{display:grid;grid-template-columns:3rem minmax(0,1fr) 7rem 7.2rem}
.grade-head{background:var(--paper-2);font-weight:700;text-align:center;border-bottom:1.5px solid var(--line)}
.grade-head span{padding:6px 8px}
.grade-head span + span{border-left:1px solid var(--line)}
.g-row + .g-row{border-top:1px solid var(--line)}
.g-row summary{list-style:none;cursor:pointer}
.g-row summary::-webkit-details-marker{display:none}
.g-row summary > span{padding:10px;display:flex;align-items:center;min-width:0}
.g-row summary > span + span{border-left:1px solid var(--line)}
.gno{justify-content:center;font-variant-numeric:tabular-nums}
.gtitle{font-weight:600;gap:8px}
.gtitle::after{content:"▾";font-size:.8rem;color:var(--ink-3);margin-left:auto;transition:transform .15s}
.g-row:not([open]) .gtitle::after{transform:rotate(-90deg)}
.gmark{flex-direction:column;justify-content:center;line-height:1.1;text-align:center}
.gmark .hand{font-size:1.7rem;line-height:1}
.gmark small{font-size:.76rem;color:var(--ink-3)}
.gmark.manual .hand{color:var(--ink-3)}
.gpts{justify-content:center;gap:6px}
.ptb{width:40px;height:40px;border:1px solid var(--hair);border-radius:50%;background:transparent;font-family:var(--hand);font-size:1.25rem;color:var(--ink-3);cursor:pointer;line-height:1}
.ptb[aria-pressed="true"]{border:2.5px solid var(--red);color:var(--red)}
@media (max-width:640px){
  .grade-head{display:none}
  .g-row summary{grid-template-columns:2.2rem minmax(0,1fr) auto}
  .g-row summary > span + span{border-left:0}
  .gmark{grid-column:2;grid-row:2;flex-direction:row;justify-content:flex-start;gap:8px;padding-top:0!important}
  .gpts{grid-column:3;grid-row:1/span 2}
}
.g-body{border-top:1px dashed var(--hair);padding:12px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
@media (max-width:700px){.g-body{grid-template-columns:1fr}}
.g-body > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:.82rem;color:var(--ink-3);font-weight:600}
.answer{color:var(--pen);white-space:pre-wrap;border:1px dotted var(--dots);padding:8px 12px;max-height:280px;overflow:auto;word-break:break-word}
.answer .empty{color:var(--ink-3);font-size:.9rem}
.answer dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.answer dt{color:var(--ink-3);font-size:.88rem}
.answer dd{margin:0}
.keytext{white-space:pre-wrap;padding:8px 12px;border:1.5px solid var(--line);word-break:break-word}
canvas.thumb{display:block;width:100%;border:1px dotted var(--dots)}
.checks{grid-column:1/-1;list-style:none;margin:0;padding:8px 0 0;border-top:1px dashed var(--hair);display:flex;flex-direction:column;gap:2px;font-size:.96rem}
.checks li{display:grid;grid-template-columns:1.6rem 1fr;gap:6px;align-items:baseline}
.checks .mk{font-family:var(--hand);color:var(--red);font-size:1.2rem;line-height:1}
.checks small{display:block;color:var(--red);font-size:.88rem}
.ovnote{grid-column:1/-1;font-size:.88rem;color:var(--ink-3)}

/* ---------- consent ---------- */
.strip{max-width:1180px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between}
.who{display:flex;flex-wrap:wrap;gap:2px 18px;align-items:baseline}
.who b{font-weight:700}
.role-tag{color:var(--ink-3);margin-right:4px;font-size:.92rem}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:22px;max-width:1180px;width:100%;margin:0 auto}
.roles .sheet{max-width:none;margin:0}
.role-head{border:1.5px solid var(--line);display:grid;grid-template-columns:auto 1fr}
.role-head span{padding:6px 12px;font-weight:700}
.role-head span + span{border-left:1.5px solid var(--line);font-weight:400}
.sheet ul,.sheet ol.plain{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.handoff{max-width:1180px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:14px 18px;border:1.5px dashed var(--line);background:var(--paper)}
.handoff p{font-weight:600}
.flow{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.flow li{display:grid;grid-template-columns:2rem 1fr;gap:8px}
.flow .fn{font-weight:700}
.talk{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,5fr);gap:22px;align-items:start;max-width:1180px;width:100%;margin:0 auto}
@media (max-width:999px){.talk{grid-template-columns:1fr}}
.talk > .sheet{max-width:none;margin:0}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:12px}
@media (max-width:999px){.side{position:static}}
.side .sheet{max-width:none;margin:0}
.side h3{font-size:1.02rem}
.field textarea{font:inherit;color:var(--pen);border:1px dotted var(--dots);padding:8px 10px;background:var(--paper);min-height:96px;resize:vertical;width:100%}
.ck-sheet{padding-bottom:0!important}
.cktable{border:1.5px solid var(--line)}
.ck-head,.ck,.ck-grp{display:grid;grid-template-columns:4rem minmax(0,1fr) 4.6rem}
.ck-head{background:var(--paper-2);font-weight:700;text-align:center;border-bottom:1.5px solid var(--line)}
.ck-head span{padding:6px}
.ck-head span + span,.ck > span + span,.ck-grp > span + span{border-left:1px solid var(--line)}
.cl{list-style:none;margin:0;padding:0}
.cl li + li{border-top:1px solid var(--line)}
.ck{width:100%;text-align:left;background:var(--paper);border:0;padding:0;min-height:52px;cursor:pointer}
.ck:hover{background:var(--paper-2)}
.ck > span{padding:10px 12px;display:flex;align-items:flex-start}
.ck .no{justify-content:center;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ck .tx{flex-direction:column}
.ck .tx small{display:block;color:var(--ink-3);font-size:.9rem}
.ck.indent .tx{padding-left:28px}
.ck .got{justify-content:center;align-items:center;font-family:var(--hand);color:var(--red);font-size:1.9rem;line-height:1}
.ck[aria-pressed="true"] .got::after{content:"✓"}
.ck-grp{background:var(--paper-2);font-weight:700}
.ck-grp > span{padding:8px 12px}
.ck-grp .no{text-align:center;font-weight:400;color:var(--ink-2)}
.ck-grp.sub .tx{padding-left:28px;font-weight:600}
.ck-total{position:sticky;bottom:0;z-index:3;background:var(--paper);border-top:3px double var(--line);margin:0 calc(-1 * clamp(18px,5.5vw,64px));padding:12px clamp(18px,5.5vw,64px) calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.ck-total b{font-weight:700}
.ck-total .hand{font-size:2rem;line-height:1;min-width:2.2ch;text-align:center;border-bottom:1.5px dotted var(--dots)}
.misslist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.misslist li{display:grid;grid-template-columns:3.4rem 1fr;gap:8px;padding:5px 0;border-bottom:1px dotted var(--dots)}
.misslist .no{color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;font-size:.95rem;z-index:20;box-shadow:var(--shadow)}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <button class="brand" data-act="go" data-arg="home" aria-label="กลับหน้าแรก"><span class="brand-mark" aria-hidden="true"><svg width="15" height="17" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1.5" y="3" width="13" height="14" rx="1"/><path d="M5.5 1.5h5v3h-5z" fill="currentColor"/><path d="M4.5 9h7M4.5 12h7M4.5 15h4"/></svg></span><span>ฝึกใบส่งตัวและใบยินยอม</span></button>
    <span class="crumb" id="crumb" hidden></span>
    <div class="bar-tools">
      <label class="switch" id="fingerSw" hidden><input type="checkbox" id="fingerToggle" data-bind="ui.finger"> เขียนด้วยนิ้วได้</label>
      <span class="chip" id="timer" hidden></span>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
const KEY='clerkship-docs-v1';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== state ===================== */
const newRefer=()=>({stage:'choose',choice:null,f:{},m:{},ink:{},ov:{},t0:null,t1:null});
const newRound=()=>({ck:{},fb:'',draw:null,t0:null,t1:null,choice:null,f:{},m:{},ink:{},ov:{}});
const newConsent=()=>({stage:'setup',names:['',''],round:0,rounds:[newRound(),newRound()],saved:false});
const defState=()=>({ui:{view:'home',finger:false,caseOpen:true},refer:newRefer(),consent:newConsent(),history:[]});
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null}
if(!S||!S.refer||!S.consent||!S.ui) S=defState();
if(!Array.isArray(S.history)) S.history=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let saveT=null; function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,350)}
function get(p){return p.split('.').reduce((o,k)=>o==null?undefined:o[k],S)}
function set(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}
const fid=p=>'f_'+p.replace(/[^a-zA-Z0-9]/g,'_');

/* ===================== text matching ===================== */
const N=s=>String(s||'').toLowerCase().replace(/[\s,:=]+/g,'').replace(/[°º˚]/g,'');
function hasNum(t,n){return new RegExp('(^|[^0-9.])'+n.replace(/\./g,'\\.')+'($|[^0-9])').test(t)}
function need(t,list){return list.filter(([label,p])=>!(p instanceof RegExp?p.test(t):hasNum(t,p))).map(x=>x[0])}
const filled=(v)=>String(v||'').trim().length>0;
const inkHas=(d)=>!!(d&&d.s&&d.s.length);

/* ===================== case data ===================== */
const CASE_TASK='ท่านเป็นแพทย์ใช้ทุนอยู่ที่ รพ.เขาสวนกวาง จงเขียนใบ Refer ส่งผู้ป่วยกลับไปรักษาต่อที่ รพ.ขอนแก่น';
const LABS=[
 ['CBC',[['Hb','12.3'],['Hct','37.2'],['Plt','222,000'],['WBC','2,900'],['PMN','92.7%'],['L','7%'],['M','0.2%'],['E','0.1%'],['B','0.1%']]],
 ['Chemistry',[['Cr','1.4'],['Na','138'],['K','3.7'],['Cl','102'],['HCO₃','19'],['Ca','8.9'],['Mg','1.4'],['PO₄','3.1']]],
 ['LFT',[['Chol','137'],['TP','7.3'],['Alb','3.2'],['Glob','4.1'],['TB','2.6'],['DB','1.8'],['ALT','115'],['AST','158'],['ALP','163']]],
 ['Coagulation',[['PT','16.2'],['PTT','38.5'],['INR','1.46']]]
];
function caseHTML(){
  return `
  <p class="task">${esc(CASE_TASK)}</p>
  <dl class="kv">
    <dt>วันที่</dt><dd>25 พ.ค. 51</dd>
    <dt>ผู้ป่วย</dt><dd>นายพร เพชรงาม · ชาย · อายุ 50 ปี</dd>
    <dt>ที่อยู่</dt><dd>12 หมู่ 5 ต.ฟ้าใส อ.เขาสวนกวาง จ.ขอนแก่น</dd>
    <dt>HN</dt><dd style="font-family:var(--mono)">4512/51</dd>
  </dl>
  <section><h3>ประวัติจากผู้ป่วย</h3>
    <div class="pi">
      <p><b>CC</b> ปวดท้องมา 3 วัน</p>
      <p><b>PI</b> <span class="when">3 วันก่อนมา รพ.</span> ปวดท้องใต้ชายโครงขวาและลิ้นปี่ ปวดจุกมาก ตลอดเวลา ไม่ร้าวไปที่ใด ไม่แสบ คลื่นไส้อาเจียน 2 ครั้ง ไม่มีถ่ายเหลว ปัสสาวะปกติ ไม่มีอาการตาเหลืองตัวเหลือง ทานอาหารได้ลดลง</p>
      <p><span class="when">1 วันก่อนมา รพ.</span> มีไข้สูงหนาวสั่น ร่วมกับอาการปวดท้องรุนแรงมากขึ้น</p>
    </div>
  </section>
  <section><h3>SR</h3>
    <ul><li>ไม่เป็นโรคเบาหวานและความดันโลหิตสูง</li><li>ไม่เคยแพ้ยา</li><li>ผอมลง แต่ไม่เคยชั่งน้ำหนัก</li><li>เลิกดื่มสุราและสูบบุหรี่มา 6 ปี</li></ul>
  </section>
  <section><h3>Physical examination</h3>
    <dl class="pe">
      <dt>GA</dt><dd>A middle age man looked distress</dd>
      <dt>V/S</dt><dd>BP 76/46 mmHg, PR 120 bpm, RR 22 /min, BT 39 °C</dd>
      <dt>HEENT</dt><dd>not pale conjunctivae, anicteric sclerae, CLN were impalpable</dd>
      <dt>Heart</dt><dd>tachycardia, no murmur</dd>
      <dt>Lungs</dt><dd>clear</dd>
      <dt>Ext.</dt><dd>no edema</dd>
      <dt>Abdomen</dt><dd>active bowel sound, marked tender at RUQ with rebound tenderness</dd>
      <dt>PR</dt><dd>yellowish feces, not tender, no rectal shelf</dd>
    </dl>
  </section>
  <section><h3>Lab</h3>
    ${LABS.map(([g,rows])=>`<div class="labgroup"><span>${g}</span><div class="labs">${rows.map(([k,v])=>`<div class="lab"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div>`).join('')}
  </section>
  <section><h3>Impression และการรักษาที่ให้แล้ว</h3>
    <p><b>Acute cholecystitis with septic shock</b> ได้ให้ 0.9% normal saline IV loading ไป 800 cc BP ขึ้นมาเป็น 90/60 mmHg · Start antibiotic เป็น ceftriaxone 2 g IV · retain NG tube และ retain Foley catheter แล้ว refer มารับการรักษาต่อ</p>
  </section>`;
}

/* ===================== refer rubric (from เฉลย) ===================== */
const LABELS={s1:'1. ประวัติการป่วยในอดีต และประวัติครอบครัว',s2:'2. ประวัติการป่วยปัจจุบัน',s3:'3. ผลการตรวจชันสูตรทางห้องทดลองที่สำคัญ',s4:'4. การวินิจฉัยโรคเบื้องต้น',s5:'5. การรักษาที่ได้ให้ไว้แล้ว',s6:'6. สาเหตุที่ส่ง',s7:'7. รายละเอียดอื่น ๆ',
  benefit:'ผลดีจากการรักษา',noTx:'ผลเสียจากไม่ได้รับการรักษา',risk:'ความเสี่ยงที่อาจเกิดขึ้น',alt:'แนวทางเลือกอื่น',altWhy:'สาเหตุที่ไม่เลือกวิธีอื่น'};
function kvShow(c,pairs){
  const rows=pairs.map(([l,k])=>`<dt>${esc(l)}</dt><dd>${filled(c.f[k])?esc(c.f[k]):'<span class="empty">ว่าง</span>'}</dd>`).join('');
  return `<div class="answer"><dl>${rows}</dl></div>`;
}
const REFER_ITEMS=[
 {id:'head',title:'หัวแบบฟอร์ม: วันที่ จาก ถึง',key:'ลงวันที่\nจาก รพ.เขาสวนกวาง\nถึง รพ.ขอนแก่น',
  show:c=>kvShow(c,[['วันที่',"d"],['เดือน','mo'],['พ.ศ.','y'],['จาก','from'],['ถึง','to']]),
  checks:[['ลงวันที่',(t,c)=>filled(c.f.d)||filled(c.f.mo)||filled(c.f.y)],
          ['จาก รพ.เขาสวนกวาง',(t,c)=>/เขาสวนกวาง/.test(N(c.f.from))],
          ['ถึง รพ.ขอนแก่น',(t,c)=>/ขอนแก่น|khonkaen/.test(N(c.f.to))]]},
 {id:'pt',title:'ข้อมูลผู้ป่วย',key:'นายพร เพชรงาม  H.N. 4512/51\nเพศชาย อายุ 50 ปี\nบ้านเลขที่ 12 หมู่ที่ 5 ต.ฟ้าใส อ.เขาสวนกวาง จ.ขอนแก่น',
  show:c=>kvShow(c,[['ชื่อ','name'],['H.N.','hn'],['เพศ','sex'],['อายุ','age'],['บ้านเลขที่','house'],['หมู่ที่','moo'],['ตำบล','tambon'],['อำเภอ','amphoe'],['จังหวัด','prov']]),
  checks:[['ชื่อ-สกุล นายพร เพชรงาม',(t,c)=>/พร/.test(N(c.f.name))&&/เพชรงาม/.test(N(c.f.name))],
          ['H.N. 4512/51',(t,c)=>/4512\/51/.test(N(c.f.hn))],
          ['เพศชาย อายุ 50 ปี',(t,c)=>{const m=[];if(!/ชาย|male|^m$/.test(N(c.f.sex)))m.push('เพศ');if(!hasNum(N(c.f.age),'50'))m.push('อายุ');return m}],
          ['ที่อยู่ 12 หมู่ 5 ต.ฟ้าใส อ.เขาสวนกวาง จ.ขอนแก่น',(t,c)=>{const m=[];if(!hasNum(N(c.f.house),'12'))m.push('บ้านเลขที่');if(!hasNum(N(c.f.moo),'5'))m.push('หมู่');if(!/ฟ้าใส/.test(N(c.f.tambon)))m.push('ตำบล');if(!/เขาสวนกวาง/.test(N(c.f.amphoe)))m.push('อำเภอ');if(!/ขอนแก่น/.test(N(c.f.prov)))m.push('จังหวัด');return m}]]},
 {id:'purpose',title:'มาเพื่อโปรด',key:'☑ รับไว้รักษาต่อ',
  show:c=>`<div class="answer">${[['p_admit','รับไว้รักษาต่อ'],['p_lab','ตรวจชันสูตร'],['p_obs','คุมไว้สังเกต'],['p_res','ขอทราบผล']].filter(([k])=>c.f[k]).map(([,l])=>'☑ '+l).join('\n')||'<span class="empty">ไม่ได้เลือก</span>'}</div>`,
  checks:[['เลือก "รับไว้รักษาต่อ"',(t,c)=>!!c.f.p_admit]]},
 {id:'pmh',title:'ประวัติการป่วยในอดีต และประวัติครอบครัว',sections:['s1'],key:'ผอมลง แต่ไม่เคยชั่งน้ำหนัก\nเลิกดื่มสุราและสูบบุหรี่มา 6 ปี',
  checks:[['ผอมลง / น้ำหนักลด',t=>/ผอม|น้ำหนักลด|weightloss|loseweight|losingweight/.test(t)],
          ['ประวัติดื่มสุรา',t=>/สุรา|เหล้า|แอลกอฮอล์|alcohol|drink/.test(t)],
          ['ประวัติสูบบุหรี่',t=>/บุหรี่|smok|cigar/.test(t)],
          ['เลิกมาแล้ว 6 ปี',t=>/6ปี|6yr|6year|หกปี/.test(t)]]},
 {id:'pi',title:'ประวัติการป่วยปัจจุบัน (CC, PI)',sections:['s2'],key:'CC: ปวดท้องมา 3 วัน\nPI: 3 วันก่อนมา รพ. ปวดท้องใต้ชายโครงขวาและลิ้นปี่ ปวดจุกมาก ตลอดเวลา ไม่ร้าวไปที่ใด ไม่แสบ คลื่นไส้อาเจียน 2 ครั้ง ไม่มีถ่ายเหลว ปัสสาวะปกติ ไม่มีอาการตาเหลืองตัวเหลือง ทานอาหารได้ลดลง\n1 วันก่อนมา รพ. มีไข้สูงหนาวสั่น ร่วมกับอาการปวดท้องรุนแรงมากขึ้น',
  checks:[['CC: ปวดท้อง 3 วัน',t=>{const m=[];if(!/ปวดท้อง|abdominalpain/.test(t))m.push('อาการปวดท้อง');if(!/3วัน|3day|สามวัน/.test(t))m.push('ระยะเวลา 3 วัน');return m}],
          ['ตำแหน่ง: ใต้ชายโครงขวาและลิ้นปี่',t=>{const m=[];if(!/ชายโครงขวา|ruq|righthypochond|rightupper/.test(t))m.push('ใต้ชายโครงขวา');if(!/ลิ้นปี่|epigastr/.test(t))m.push('ลิ้นปี่');return m}],
          ['ลักษณะปวด: จุก ตลอดเวลา ไม่ร้าว',t=>/จุก|ตลอดเวลา|constant|continuous|ไม่ร้าว|noradiat/.test(t)],
          ['คลื่นไส้อาเจียน',t=>/คลื่นไส้|อาเจียน|nausea|vomit/.test(t)],
          ['ไข้สูงหนาวสั่น',t=>{const m=[];if(!/ไข้|fever/.test(t))m.push('ไข้');if(!/หนาวสั่น|chill|rigor/.test(t))m.push('หนาวสั่น');return m}],
          ['ไม่มีตาเหลืองตัวเหลือง',t=>/ไม่มี(อาการ)?(ตา|ตัว)เหลือง|ตาไม่เหลือง|ตัวไม่เหลือง|nojaundice|nojaundic|deniedjaundice|denyjaundice/.test(t)]]},
 {id:'pe',title:'ตรวจร่างกายและสัญญาณชีพ',sections:['s2','s3','s7'],key:'GA: A middle age man looked distress\nV/S: BP 76/46 mmHg PR 120 bpm RR 22 /min BT 39 °C\nHEENT: not pale conjunctivae, anicteric sclerae, CLN were impalpable\nHeart: tachycardia, no murmur · Lungs: clear · Extremities: no edema\nAbdomen: active bowel sound, marked tender at RUQ with rebound tenderness\nPR: yellowish feces, not tender, no rectal shelf\n(เฉลยเขียนต่อในหัวข้อ 2)',
  checks:[['BP 76/46 mmHg',t=>/76\/46/.test(t)],
          ['PR 120 bpm',t=>/(pr|hr|p|pulse|ชีพจร)120/.test(t)],
          ['RR 22 /min',t=>/(rr|r|หายใจ)22/.test(t)],
          ['BT 39 °C',t=>/(bt|t|temp\w*|อุณหภูมิ)39|39(c|องศา|\.0)/.test(t)],

const TH=n=>String(n).replace(/\d/g,d=>'๐๑๒๓๔๕๖๗๘๙'[d]);
function ctxRefer(){const r=S.refer;return{scope:'refer',f:r.f,m:r.m,ink:r.ink,ov:r.ov,choice:r.first||r.choice}}
function ctxRound(i){const r=S.consent.rounds[i];return{scope:'consent.rounds.'+i,f:r.f,m:r.m,ink:r.ink,ov:r.ov,choice:r.first||r.choice}}
function evalItem(it,c){
  const secs=it.sections||[];
  const text=N(secs.map(k=>c.m[k]==='ink'?'':(c.f[k]||'')).join(' '));
  const inkUsed=secs.some(k=>c.m[k]==='ink'&&inkHas(c.ink[k]));
  const res=it.checks.map(([label,fn])=>{const r=fn(text,c);const ok=r===true||(Array.isArray(r)&&r.length===0);return{label,ok,miss:Array.isArray(r)?r:[]}});
  const n=res.filter(r=>r.ok).length;
  let status=n===res.length?'pass':(inkUsed?'manual':(n?'partial':'miss'));
  if(status!=='pass'&&it.manualIf&&it.manualIf(c))status='manual';
  return{res,status,auto:status==='pass'?1:status==='manual'?null:0};
}
function tally(items,c){let s=0,p=0;items.forEach(it=>{const e=evalItem(it,c);const ov=c.ov[it.id];const v=ov!=null?ov:e.auto;if(v==null)p++;else s+=v});return{s,p,t:items.length}}
const MARK={pass:['✓','ครบตามเฉลย'],partial:['–','ยังไม่ครบ'],miss:['✕','ไม่พบ'],manual:['?','ตรวจด้วยตา']};
function showSections(it,c){
  return it.sections.map(k=>{
    const label=it.sections.length>1?`<p class="lbl">${esc(LABELS[k]||k)}</p>`:'';
    if(c.m[k]==='ink') return label+(inkHas(c.ink[k])?`<canvas class="thumb" data-thumb="${c.scope}.ink.${k}"></canvas>`:'<div class="answer"><span class="empty">ไม่ได้เขียน</span></div>');
    return label+`<div class="answer">${filled(c.f[k])?esc(c.f[k]):'<span class="empty">ไม่ได้เขียน</span>'}</div>`;
  }).join('');

/* ===================== ink engine ===================== */
const pads=new Map(); let penActive=false, penT=null;
function penColor(){return getComputedStyle(document.documentElement).getPropertyValue('--pen').trim()||'#1B4A99'}
function scrollParent(el){let p=el.parentElement;while(p){const s=getComputedStyle(p).overflowY;if((s==='auto'||s==='scroll')&&p.scrollHeight>p.clientHeight)return p;p=p.parentElement}return document.scrollingElement}
function drawStrokes(ctx,d,scale){
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=penColor();
  d.s.forEach(st=>{const p=st.pts;if(p.length<3)return;
    if(p.length===3){ctx.beginPath();ctx.fillStyle=ctx.strokeStyle;ctx.arc(p[0]*scale,p[1]*scale,1.4*scale,0,7);ctx.fill();return}
    for(let i=3;i<p.length;i+=3){ctx.beginPath();ctx.lineWidth=(st.pen?0.8+p[i+2]*2.6:2.2)*Math.max(scale,.5);ctx.moveTo(p[i-3]*scale,p[i-2]*scale);ctx.lineTo(p[i]*scale,p[i+1]*scale);ctx.stroke()}
  });
}
function sizePad(pad){
  const w=pad.cv.parentElement.clientWidth||300; if(!pad.d.w)pad.d.w=w;
  pad.scale=w/pad.d.w; const h=Math.round(pad.d.h*pad.scale); const dpr=window.devicePixelRatio||1;
  pad.cv.width=Math.round(w*dpr);pad.cv.height=Math.round(h*dpr);pad.cv.style.height=h+'px';
  pad.ctx.setTransform(dpr,0,0,dpr,0,0);redraw(pad);
}
function redraw(pad){pad.ctx.clearRect(0,0,pad.cv.width,pad.cv.height);drawStrokes(pad.ctx,pad.d,pad.scale)}
function commit(pad){set(pad.path,pad.d);saveSoon()}
function mountInk(root){
  $$('.inkpad',root).forEach(el=>{
    const path=el.dataset.ink, cv=el.querySelector('canvas');
    let d=get(path); if(!d||!Array.isArray(d.s)) d={w:0,h:+el.dataset.h||200,s:[]};
    const pad={el,cv,path,d,ctx:cv.getContext('2d'),cur:null,scroll:null,scale:1,board:el.classList.contains('board')};
    pads.set(path,pad); sizePad(pad);
    const pos=e=>{const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)/pad.scale*10)/10,Math.round((e.clientY-r.top)/pad.scale*10)/10,Math.round((e.pressure||.5)*100)/100]};
    cv.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch'&&penActive) {e.preventDefault();return}
      if(e.pointerType==='touch'&&!(S.ui.finger||pad.board)){pad.scroll={y:e.clientY,id:e.pointerId,sp:scrollParent(el)};try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
      if(e.pointerType==='pen'){penActive=true;clearTimeout(penT)}
      e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
      pad.cur={pen:e.pointerType==='pen',pts:pos(e)};pad.d.s.push(pad.cur);redrawLast(pad);
    });
    cv.addEventListener('pointermove',e=>{
      if(pad.scroll&&e.pointerId===pad.scroll.id){const dy=e.clientY-pad.scroll.y;pad.scroll.y=e.clientY;if(pad.scroll.sp)pad.scroll.sp.scrollTop-=dy;return}
      if(!pad.cur)return; e.preventDefault();
      const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
      (evs.length?evs:[e]).forEach(ev=>{const p=pos(ev);pad.cur.pts.push(p[0],p[1],p[2]);segment(pad)});
    });
    const end=e=>{pad.scroll=null;if(e.pointerType==='pen'){penT=setTimeout(()=>{penActive=false},600)}if(pad.cur){pad.cur=null;commit(pad)}};
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  });
}
function segment(pad){const st=pad.cur,p=st.pts,i=p.length-3;if(i<3)return;const c=pad.ctx,s=pad.scale;c.lineCap='round';c.strokeStyle=penColor();c.beginPath();c.lineWidth=(st.pen?0.8+p[i+2]*2.6:2.2)*Math.max(s,.5);c.moveTo(p[i-3]*s,p[i-2]*s);c.lineTo(p[i]*s,p[i+1]*s);c.stroke()}
function redrawLast(pad){const p=pad.cur.pts,c=pad.ctx,s=pad.scale;c.fillStyle=penColor();c.beginPath();c.arc(p[0]*s,p[1]*s,1.2*s,0,7);c.fill()}
function drawThumbs(root){
  $$('canvas.thumb',root).forEach(cv=>{const d=get(cv.dataset.thumb);if(!inkHas(d))return;const w=cv.clientWidth||300;const scale=w/d.w;const h=Math.round(d.h*scale);const dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);drawStrokes(ctx,d,scale)});
}
let rzT=null; window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{pads.forEach(sizePad);drawThumbs(document)},150)});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{pads.forEach(redraw);drawThumbs(document)})}catch(e){}

    <div class="sigblock">
      <div class="sigcol"><b>ลงชื่อ ผู้ให้ความยินยอม</b>${inkpad(sc+'.ink.pSig','sig',110)}${inp(P+'pName','(ชื่อตัวบรรจง)','12rem')}<div class="opts">${rad(P+'pAs','self','ผู้ป่วยเอง')}${rad(P+'pAs','kin','ญาติ*')}</div>${inp(P+'pRel','* ระบุความสัมพันธ์กับผู้ป่วย','10rem')}${inp(P+'pDate','วันที่','10rem')}</div>
      <div class="sigcol"><b>ลงชื่อ ผู้ให้ข้อมูลหัตถการ/การตรวจ–รักษาพิเศษ</b>${inkpad(sc+'.ink.dSig','sig',110)}${inp(P+'dName','(ชื่อตัวบรรจง)','12rem')}${inp(P+'dDate','วันที่','10rem')}</div>
    </div>
    <p class="legal">ขอรับรองว่าผู้ป่วยหรือผู้ตัดสินใจแทนผู้ป่วยได้ให้ความยินยอมหรือลงลายพิมพ์นิ้วมือต่อหน้าพยานจริง</p>
    <div class="frow">${inp(P+'w1','ลงชื่อ พยาน','12rem')}${inp(P+'w1r','ระบุ','8rem')}</div>
    <div class="frow">${inp(P+'w2','ลงชื่อ พยาน','12rem')}${inp(P+'w2r','ระบุ','8rem')}</div>
    <details><summary>กรณีผู้ป่วยไม่อาจให้ความยินยอมได้ด้วยตนเอง</summary>
      <div class="opts" style="padding-top:8px">${chk(P+'r_minor','อายุไม่เกินยี่สิบปีบริบูรณ์')}${chk(P+'r_dis','ผู้บกพร่องทางกาย–จิต')}${chk(P+'r_other','อื่น ๆ')}</div>
      ${inp(P+'r_note','ระบุ','14rem')}</details>
    <div class="form-foot"><span>พ. 155</span><span>หน้า ๑</span></div>
  </form></article>
  <div class="submit-row"><button type="button" class="btn primary lg" data-act="cGrade">ส่งตรวจรอบนี้</button><span class="muted">ส่งแล้วยังกลับมาแก้ไขได้</span></div>`;
  return `<div style="max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px">${html}</div>`;
}
function consentResult(){
  const i=S.consent.round, R=S.consent.rounds[i], c=ctxRound(i), s=ckScore(R), ft=tally(CONSENT_ITEMS,c);
  const missed=LEAVES.filter(x=>!R.ck[x.n]);
  const time=R.t0?fmtTime((R.t1||Date.now())-R.t0):'–';
  return `<div class="talk">
    <article class="sheet">
      <h2 class="doc-title">ใบให้คะแนน · รอบที่ ${TH(i+1)}</h2>
      <div class="rhead">
        <div class="redscore" aria-label="ได้ ${s} จาก ${CK_TOTAL} คะแนน">${s}<small>/${CK_TOTAL}</small></div>
        <div class="scoreinfo"><span class="vstamp ${s>=PASS?'':''}">${s>=PASS?'ผ่าน':'ไม่ผ่าน'}</span><p class="muted">แพทย์ ${esc(nm(docIdx()))} · เกณฑ์ผ่าน ${PASS} คะแนน · เวลาสนทนา ${time}</p></div>
        <div class="row"><button type="button" class="btn primary" data-act="cNext">${i===0?'สลับบท เริ่มรอบที่ ๒':'ดูสรุปทั้งคู่'}</button></div>
      </div>
      <h3 class="doc-h">ตรวจใบยินยอม <span class="muted" style="font-weight:400">ครบ ${ft.s}/${ft.t} ข้อ${ft.p?` · รอตรวจ ${ft.p}`:''} · ไม่รวมในคะแนน checklist</span></h3>
      ${rubricHTML(CONSENT_ITEMS,c)}
    </article>
    <aside class="side">
      <article class="sheet mini"><h3>ข้อที่ยังไม่ได้อธิบาย (${missed.length})</h3>${missed.length?`<ul class="misslist">${missed.map(x=>`<li><span class="no">${x.n}</span><span>${esc(x.t)}</span></li>`).join('')}</ul>`:'<p>อธิบายครบทุกข้อ</p>'}<div><button type="button" class="btn sm" data-act="cStep" data-arg="1">กลับไปแก้ checklist</button></div></article>
      ${filled(R.fb)?`<article class="sheet mini"><h3>ข้อเสนอแนะจากผู้ป่วย</h3><p style="white-space:pre-wrap;color:var(--pen)">${esc(R.fb)}</p></article>`:''}
      ${inkHas(R.draw)?`<article class="sheet mini"><h3>รูปที่วาดประกอบ</h3><canvas class="thumb" data-thumb="consent.rounds.${i}.draw"></canvas></article>`:''}
    </aside>
  </div>`;
}
function consentSummary(){
  const c=S.consent;
  const v=i=>{const R=c.rounds[i],s=ckScore(R),ft=tally(CONSENT_ITEMS,ctxRound(i));return{s,ft,R}};
  const a=v(0),b=v(1);
  const tm=R=>R.t0?fmtTime((R.t1||Date.now())-R.t0):'–';
  return `<div class="deskwrap"><article class="sheet">
    <span class="stamp">สรุปผล</span>
    <h1 class="doc-title">สรุปผลการฝึกขอความยินยอม</h1>
    <p class="center">${esc(nm(0))} และ ${esc(nm(1))}</p>
    <div class="tablewrap"><table class="doc">
      <thead><tr><th>รายการ</th><th>รอบที่ ๑ · แพทย์ ${esc(nm(0))}</th><th>รอบที่ ๒ · แพทย์ ${esc(nm(1))}</th></tr></thead>
      <tbody>
        <tr><td>คะแนน checklist</td><td class="c"><span class="hand">${a.s}/${CK_TOTAL}</span></td><td class="c"><span class="hand">${b.s}/${CK_TOTAL}</span></td></tr>
        <tr><td>ผลการประเมิน (ผ่านที่ ${PASS})</td><td class="c">${a.s>=PASS?'ผ่าน':'ไม่ผ่าน'}</td><td class="c">${b.s>=PASS?'ผ่าน':'ไม่ผ่าน'}</td></tr>
        <tr><td>ความครบของใบยินยอม</td><td class="c">${a.ft.s}/${a.ft.t}</td><td class="c">${b.ft.s}/${b.ft.t}</td></tr>
        <tr><td>เลือกใบยินยอม (ครั้งแรก)</td><td class="c">${(a.R.first||a.R.choice)==='proc'?'ถูกใบ':'ผิดใบ'}</td><td class="c">${(b.R.first||b.R.choice)==='proc'?'ถูกใบ':'ผิดใบ'}</td></tr>
        <tr><td>เวลาสนทนา</td><td class="c">${tm(a.R)}</td><td class="c">${tm(b.R)}</td></tr>
        <tr><td></td><td class="c"><button type="button" class="btn sm" data-act="cOpenRound" data-arg="0">ดูรายละเอียด</button></td><td class="c"><button type="button" class="btn sm" data-act="cOpenRound" data-arg="1">ดูรายละเอียด</button></td></tr>
      </tbody></table></div>
    <p class="muted">บันทึกผลไว้ในทะเบียนผลการฝึกบนเครื่องนี้แล้ว</p>
    <div class="row"><button type="button" class="btn primary" data-act="cNew" data-confirm="แตะอีกครั้งเพื่อล้างข้อมูลคู่นี้">เริ่มคู่ใหม่</button><button type="button" class="btn" data-act="go" data-arg="home">กลับหน้าแรก</button></div>
  </article></div>`;
}

/* ===================== render & events ===================== */
const view=$('#view');
let lastKey='';
function viewKey(){const v=S.ui.view;return v==='refer'?'refer:'+S.refer.stage:v==='consent'?'consent:'+S.consent.stage+':'+S.consent.round:'home'}
function render(keepScroll){
  const key=viewKey();const same=keepScroll!==false&&key===lastKey;
  const sc=same?$$('main, .pane').map(el=>el.scrollTop):null;
  pads.clear();
  view.innerHTML=S.ui.view==='refer'?referView():S.ui.view==='consent'?consentView():homeView();
  lastKey=key;
  mountInk(view);$$('textarea.ruled',view).forEach(grow);drawThumbs(view);
  if(sc){$$('main, .pane').forEach((el,i)=>{if(sc[i]!=null)el.scrollTop=sc[i]})}else{$$('main, .pane').forEach(el=>el.scrollTop=0)}
  const crumb=$('#crumb');const labels={refer:'ใบ Refer',consent:'Informed consent'};
  crumb.hidden=!labels[S.ui.view];crumb.textContent=labels[S.ui.view]||'';
  const writing=(S.ui.view==='refer'&&S.refer.stage==='write')||(S.ui.view==='consent'&&S.consent.stage==='form');
  $('#fingerSw').hidden=!writing;$('#fingerToggle').checked=!!S.ui.finger;
  tick();save();
}
function grow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,parseFloat(getComputedStyle(t).minHeight)||0)+'px'}
function tick(){
  const el=$('#timer');let t0=null,t1=null;
  if(S.ui.view==='refer'&&S.refer.stage!=='choose'){t0=S.refer.t0;t1=S.refer.t1}
  else if(S.ui.view==='consent'&&['talk','form','result'].includes(S.consent.stage)){const R=S.consent.rounds[S.consent.round];t0=R.t0;t1=R.t1}
  el.hidden=!t0; if(t0) el.textContent='เวลา '+fmtTime((t1||Date.now())-t0);
}
setInterval(tick,1000);
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open)drawThumbs(e.target)},true);
let toastT=null;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

document.addEventListener('input',onField);document.addEventListener('change',onField);
function onField(e){
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  if(el.type==='checkbox')set(b,el.checked);
  else if(el.type==='radio'){if(el.checked)set(b,el.value)}
  else set(b,el.value);
  if(el.tagName==='TEXTAREA'&&el.classList.contains('ruled'))grow(el);
  saveSoon();
}
const ACT={
  go(a){S.ui.view=a;render(false)},
  toggleCase(){S.ui.caseOpen=S.ui.caseOpen===false;render()},
  referStep(a){const st=['choose','write','result'][+a];if(st==='write'&&!S.refer.choice)return;if(st==='write'){if(!S.refer.t0)S.refer.t0=Date.now();S.refer.t1=null}if(st==='result')S.refer.t1=S.refer.t1||Date.now();S.refer.stage=st;render(false)},
  referChoose(a){if(!S.refer.first)S.refer.first=a;S.refer.choice=a;render()},
  referToForm(){S.refer.stage='write';if(!S.refer.t0)S.refer.t0=Date.now();render(false)},
  referGrade(){S.refer.stage='result';S.refer.t1=Date.now();render(false)},
  referEdit(){S.refer.stage='write';S.refer.t1=null;render(false)},
  referReset(){S.refer=newRefer();render(false)},
  referSave(){const t=tally(REFER_ITEMS,ctxRefer());S.history.push({type:'refer',at:Date.now(),s:t.s,t:t.t,p:t.p,name:S.refer.f.signName||''});save();toast(t.p?'บันทึกแล้ว (ยังมีข้อรอตรวจ '+t.p+' ข้อ)':'บันทึกผลแล้ว')},
  ov(a){const [sc,id,v]=a.split('|');set(sc+'.ov.'+id,+v);render()},
  ovClear(a){const [sc,id]=a.split('|');const o=get(sc+'.ov');if(o)delete o[id];render()},
  mode(a,btn){const sec=btn.closest('.sec');const sc=sec.dataset.scope,k=sec.dataset.key;set(sc+'.m.'+k,a);
    $$('button',btn.parentElement).forEach(b=>b.setAttribute('aria-pressed',b.dataset.arg===a));
    const body=$('.sec-body',sec);body.innerHTML=areaBody(sc,k,+sec.dataset.rows||3);mountInk(body);$$('textarea.ruled',body).forEach(grow);saveSoon()},
  inkUndo(a){const p=pads.get(a);if(!p)return;p.d.s.pop();redraw(p);commit(p)},
  inkClear(a){const p=pads.get(a);if(!p)return;p.d.s=[];redraw(p);commit(p)},
  inkGrow(a){const p=pads.get(a);if(!p)return;p.d.h+=140;sizePad(p);commit(p)},
  ck(a,btn){const R=S.consent.rounds[S.consent.round];R.ck[a]=!R.ck[a];btn.setAttribute('aria-pressed',!!R.ck[a]);
    const s=ckScore(R);$('#sbNum').textContent=s;$('#sbPass').textContent=passText(s);saveSoon()},
  cStart(){S.consent.stage='brief';S.consent.round=0;render(false)},
  cStep(a){const st=['brief','talk','form','result'][+a];const R=S.consent.rounds[S.consent.round];if(st==='talk'&&!R.t0)R.t0=Date.now();S.consent.stage=st;render(false)},
  cTalk(){const R=S.consent.rounds[S.consent.round];if(!R.t0)R.t0=Date.now();R.t1=null;S.consent.stage='talk';render(false)},
  cToForm(){const R=S.consent.rounds[S.consent.round];if(!R.t1)R.t1=Date.now();S.consent.stage='form';render(false)},
  cChoose(a){const R=S.consent.rounds[S.consent.round];if(!R.first)R.first=a;R.choice=a;render()},
  cGrade(){const R=S.consent.rounds[S.consent.round];R.graded=true;if(!R.t1)R.t1=Date.now();S.consent.stage='result';render(false)},
  cNext(){const c=S.consent;if(c.round===0){c.round=1;c.stage='brief'}else{c.stage='summary';if(!c.saved){c.saved=true;S.history.push({type:'consent',at:Date.now(),a:nm(0),b:nm(1),sa:ckScore(c.rounds[0]),sb:ckScore(c.rounds[1])})}}render(false)},
  cOpenRound(a){S.consent.round=+a;S.consent.stage='result';render(false)},
  cNew(){S.consent=newConsent();render(false)}
};
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');if(!btn)return;
  if(btn.closest('summary'))e.preventDefault();
  if(btn.disabled)return;
  if(btn.dataset.confirm&&!btn.dataset.armed){const orig=btn.textContent;btn.dataset.armed='1';btn.textContent=btn.dataset.confirm;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=orig}},3000);return}
  const fn=ACT[btn.dataset.act];if(fn)fn(btn.dataset.arg,btn);
});
render(false);
})();
</script>

</body>
</html>
