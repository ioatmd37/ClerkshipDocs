<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="ฝึก Refer/Consent">
<meta name="theme-color" content="#2B6555">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>ฝึกใบส่งตัวและใบยินยอม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: a ward desk. Case notes sit on the left, the paper form on the right, each scrolling on its own.
   Printed form text is black Sarabun (the Thai government document face); everything the student writes is ballpoint blue. */
:root{
  --ground:#EBEFED; --sheet:#FBFCFB; --sheet-2:#F3F6F4;
  --ink:#17231E; --ink-2:#4B5B55; --ink-3:#77867F;
  --rule:#C8D2CD; --rule-2:#DDE4E0;
  --accent:#2B6555; --accent-ink:#FFFFFF; --accent-soft:#DBEAE3;
  --pen:#1B4A99;
  --ok:#2C7549; --ok-soft:#DFF0E5; --warn:#8F5E00; --warn-soft:#F5EAD0; --miss:#A3382E; --miss-soft:#F6E1DE; --info-soft:#E2E9F2;
  --shadow:0 1px 2px rgba(23,35,30,.06),0 12px 30px -18px rgba(23,35,30,.25);
  --ui:"IBM Plex Sans Thai",-apple-system,system-ui,"Sarabun",sans-serif;
  --paper:"Sarabun","IBM Plex Sans Thai",-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --lh:2.1rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111715; --sheet:#19211E; --sheet-2:#151C19;
  --ink:#E0E7E3; --ink-2:#A7B5AF; --ink-3:#7D8C86;
  --rule:#34413C; --rule-2:#27312D;
  --accent:#7FC0AA; --accent-ink:#0E1914; --accent-soft:#1E3530;
  --pen:#8FB3F4;
  --ok:#7DC898; --ok-soft:#1A3224; --warn:#E2B45E; --warn-soft:#382C15; --miss:#EE8F84; --miss-soft:#3A201C; --info-soft:#1D2939;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#111715; --sheet:#19211E; --sheet-2:#151C19;
  --ink:#E0E7E3; --ink-2:#A7B5AF; --ink-3:#7D8C86;
  --rule:#34413C; --rule-2:#27312D;
  --accent:#7FC0AA; --accent-ink:#0E1914; --accent-soft:#1E3530;
  --pen:#8FB3F4;
  --ok:#7DC898; --ok-soft:#1A3224; --warn:#E2B45E; --warn-soft:#382C15; --miss:#EE8F84; --miss-soft:#3A201C; --info-soft:#1D2939;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--sheet);border-bottom:1px solid var(--rule);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;cursor:pointer;font-weight:600;font-size:1rem}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--paper);font-weight:700;font-size:.8rem;letter-spacing:.02em}
.crumb{color:var(--ink-3);font-size:.95rem}
.crumb::before{content:"/";margin-right:12px;color:var(--rule)}
.bar-tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.88rem;padding:4px 10px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);color:var(--ink-2);font-variant-numeric:tabular-nums}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink-2);cursor:pointer;min-height:36px}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--rule);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--sheet);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}
main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:.5em 1.05em;border-radius:10px;min-height:44px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:.25em .8em;font-size:.88rem;border-radius:8px}
.btn.lg{min-height:52px;padding:.6em 1.6em;font-size:1.05rem}
.btn[data-armed]{border-color:var(--miss);color:var(--miss)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:inherit}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-3);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- home ---------- */
.wrap{max-width:1060px;margin:0 auto;padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
.intro{display:flex;flex-direction:column;gap:10px;max-width:46rem}
.intro h1{font-size:clamp(1.55rem,3.2vw,2.1rem);font-weight:600}
.intro .lede{color:var(--ink-2);font-size:1.05rem}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:28px 22px;padding-top:14px;align-items:start}
.folder{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:0 12px 12px 12px;padding:24px 24px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.folder .tab{position:absolute;left:-1px;top:-30px;height:31px;padding:4px 16px 0;background:var(--sheet);border:1px solid var(--rule);border-bottom:0;border-radius:10px 10px 0 0;font-size:.82rem;color:var(--ink-2);font-weight:500}
.folder h2{font-size:1.35rem;font-weight:600}
.folder p{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0;padding:12px 0;border-block:1px solid var(--rule-2)}
.meta div{display:flex;flex-direction:column}
.meta dt{font-size:.78rem;color:var(--ink-3)}
.meta dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.folder .btn{align-self:flex-start}
.history h2{font-size:1.1rem;font-weight:600;margin-bottom:10px}
.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.hist li{display:grid;grid-template-columns:9.5rem 1fr auto;gap:4px 16px;padding:10px 2px;border-bottom:1px solid var(--rule-2);align-items:baseline}
.hist time{font-family:var(--mono);font-size:.84rem;color:var(--ink-3)}
.hist b{font-variant-numeric:tabular-nums}
@media (max-width:560px){.hist li{grid-template-columns:1fr auto}.hist time{grid-column:1/-1}}
.foot{color:var(--ink-3);font-size:.88rem}

/* ---------- split (refer) ---------- */
.split{height:100%;display:grid;grid-template-columns:minmax(300px,5fr) minmax(0,7fr)}
.pane{min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.case{background:var(--sheet-2);border-right:1px solid var(--rule)}
.pane-head{position:sticky;top:0;z-index:2;background:var(--sheet-2);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;border-bottom:1px solid var(--rule-2)}
.pane-head h2{font-size:1.1rem;font-weight:600}
.case-body{padding-block:16px 48px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px;font-size:.98rem}
.only-narrow{display:none}
@media (max-width:999px){
  .split{display:flex;flex-direction:column}
  .case{flex:0 0 auto;max-height:44%;border-right:0;border-bottom:1px solid var(--rule)}
  .case.collapsed .case-body{display:none}
  .work{flex:1 1 auto}
  .only-narrow{display:inline-flex}
  .pane-head{padding-right:max(18px,env(safe-area-inset-right,0px))}
  .case-body{padding-right:max(18px,env(safe-area-inset-right,0px))}
}
.task{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-weight:500;color:var(--ink)}
.case h3{font-size:.8rem;letter-spacing:.07em;color:var(--ink-3);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--rule-2);margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.case ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px}
.pi{display:flex;flex-direction:column;gap:6px}
.pi .when{font-weight:600}
.pe{display:grid;grid-template-columns:5.2rem 1fr;gap:4px 12px;margin:0}
.pe dt{font-family:var(--mono);font-size:.85rem;color:var(--accent);padding-top:2px}
.pe dd{margin:0}
.labgroup{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.labgroup > span{font-size:.82rem;font-weight:600;color:var(--ink-2)}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.4rem,1fr));gap:0 14px}
.lab{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.86rem;border-bottom:1px dotted var(--rule);padding:3px 0;font-variant-numeric:tabular-nums}
.lab span{color:var(--ink-3)}

.work-inner{max-width:880px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.steps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.step{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 10px;border-radius:8px;color:var(--ink-3);font-size:.9rem;min-height:40px;cursor:pointer}
.step .sn{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.75rem;font-family:var(--mono)}
.step[aria-current="step"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.step.done{color:var(--ink-2)}
.step.done .sn{background:var(--ink-3);border-color:var(--ink-3);color:var(--sheet)}
.step:disabled{cursor:default;opacity:.6}
.h-sec{font-size:1.3rem;font-weight:600}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.choice{text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.choice:hover{border-color:var(--ink-3)}
.choice .mini-title{font-family:var(--paper);font-weight:700;font-size:1.05rem;line-height:1.4}
.choice .mini-sub{font-size:.88rem;color:var(--ink-2)}
.choice .code{font-family:var(--mono);font-size:.78rem;color:var(--ink-3)}
.choice[aria-pressed="true"].right{border-color:var(--ok);background:var(--ok-soft)}
.choice[aria-pressed="true"].wrong{border-color:var(--miss);background:var(--miss-soft)}
.note{padding:12px 16px;border-radius:8px;background:var(--info-soft);display:flex;flex-direction:column;gap:6px}
.note.ok{background:var(--ok-soft)}
.note.bad{background:var(--miss-soft)}
.note b{font-weight:600}

/* ---------- paper form ---------- */
.paper{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:3px;padding:clamp(18px,4vw,44px);font-family:var(--paper);font-size:1.06rem;display:flex;flex-direction:column;gap:16px}
.paper-title{text-align:center;font-weight:700;font-size:1.22rem;font-family:var(--paper)}
.paper-sub{text-align:center;color:var(--ink-3);font-size:.85rem;font-family:var(--ui);margin-top:-10px}
.frow{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end}
.fl{display:flex;align-items:baseline;gap:8px;min-width:0}
.frow > .fl{flex:1 1 var(--w,12rem)}
.fl > span{white-space:nowrap}
.dot{flex:1;min-width:3ch;width:100%;border:0;border-bottom:1.5px dotted var(--ink-3);background:transparent;color:var(--pen);font:inherit;font-size:1.06rem;padding:2px 4px;border-radius:0;-webkit-appearance:none}
.dot:focus{outline:none;border-bottom:1.5px solid var(--pen);background:color-mix(in srgb,var(--pen) 7%,transparent)}
.dot::placeholder{color:var(--ink-3);opacity:.6}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border:1px solid var(--rule);border-radius:999px;font-size:.98rem;min-height:40px;cursor:pointer;background:var(--sheet)}
.opt input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--pen);color:var(--pen)}
.sec{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.sec-title{font-weight:600}
.sec-hint{font-family:var(--ui);font-size:.84rem;color:var(--ink-3)}
.mode{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--sheet-2);font-family:var(--ui);font-size:.82rem}
.mode button{border:0;background:transparent;color:var(--ink-2);padding:3px 14px;border-radius:999px;min-height:32px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
textarea.ruled{display:block;width:100%;border:0;resize:none;overflow:hidden;font:inherit;font-size:1.06rem;color:var(--pen);line-height:var(--lh);background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));background-attachment:local;padding:0 6px;min-height:calc(var(--lh) * 3);border-radius:0}
textarea.ruled:focus{outline:none;background-color:color-mix(in srgb,var(--pen) 4%,transparent)}
.inkpad{display:flex;flex-direction:column;gap:6px}
.ink-surface{border:1px dashed var(--rule);border-radius:6px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule-2) 35px,var(--rule-2) 36px);overflow:hidden}
.ink-surface canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.sig .ink-surface{background-image:none;background-color:var(--sheet-2);border-style:solid}
.ink-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--ui)}
.ink-tools .muted{font-size:.8rem;margin-left:auto}
.paper-foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.82rem;color:var(--ink-3);padding-top:6px;border-top:1px solid var(--rule-2)}
.sigblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 24px;align-items:start}
.sigcol{display:flex;flex-direction:column;gap:8px}
.sigcol > b{font-weight:600}
.submit-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* consent paper header boxes */
.c-head{display:grid;grid-template-columns:1fr 1.5fr 1.2fr;border:1.5px solid var(--ink);font-size:.98rem}
.c-head > div{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.c-head > div + div{border-left:1.5px solid var(--ink)}
.c-org{justify-content:space-between}
.c-org b{font-weight:700;line-height:1.35}
.c-org .formno{border-top:1.5px solid var(--ink);margin:6px -12px -10px;padding:8px 12px;font-weight:600}
@media (max-width:760px){.c-head{grid-template-columns:1fr}.c-head > div + div{border-left:0;border-top:1.5px solid var(--ink)}}
.c-title{text-align:center;font-weight:700;padding:8px 0;border-block:3px double var(--ink)}
.mark{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
.markbox{border:1.5px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1 1 320px}
.prose{line-height:2.2}
.prose .dot{width:auto;display:inline-block;vertical-align:baseline}
.legal{color:var(--ink-2);font-size:.98rem;line-height:1.85}
.paper details{border:1px solid var(--rule);border-radius:6px;padding:8px 12px}
.paper summary{cursor:pointer;font-weight:600;font-family:var(--ui);font-size:.95rem;min-height:32px}

/* ---------- rubric / results ---------- */
.scorehead{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;padding:18px 22px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow)}
.bignum{font-family:var(--paper);font-weight:700;font-size:3.1rem;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:1.4rem;color:var(--ink-3);font-weight:500}
.scoreinfo{display:flex;flex-direction:column;gap:4px;flex:1 1 240px;min-width:0}
.scorehead .row{margin-left:auto}
.verdict{display:inline-flex;align-self:flex-start;font-weight:600;font-size:.9rem;padding:3px 12px;border-radius:999px}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--miss-soft);color:var(--miss)}
.verdict.wait{background:var(--warn-soft);color:var(--warn)}
.rubric{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.item{background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.item summary{list-style:none;display:grid;grid-template-columns:2rem minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.ino{font-family:var(--mono);font-size:.86rem;color:var(--ink-3)}
.ititle{font-weight:600;min-width:0}
.pill{font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.pass{background:var(--ok-soft);color:var(--ok)}
.pill.partial{background:var(--warn-soft);color:var(--warn)}
.pill.miss{background:var(--miss-soft);color:var(--miss)}
.pill.manual{background:var(--info-soft);color:var(--ink-2)}
.pts{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.ptb{border:0;background:var(--sheet);min-width:40px;min-height:36px;font-family:var(--mono);font-weight:500;cursor:pointer;color:var(--ink-3)}
.ptb + .ptb{border-left:1px solid var(--rule)}
.ptb[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
@media (max-width:600px){.item summary{grid-template-columns:1.6rem minmax(0,1fr) auto}.item .pill{grid-column:2;justify-self:start}.item .pts{grid-row:1;grid-column:3}}
.item-body{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:2px 14px 16px}
@media (max-width:700px){.item-body{grid-template-columns:1fr}}
.item-body > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:.78rem;color:var(--ink-3);letter-spacing:.05em}
.answer{font-family:var(--paper);color:var(--pen);white-space:pre-wrap;background:var(--sheet-2);border-radius:6px;padding:10px 12px;max-height:280px;overflow:auto;word-break:break-word}
.answer .empty{color:var(--ink-3);font-family:var(--ui);font-size:.9rem}
.answer dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.answer dt{color:var(--ink-3);font-family:var(--ui);font-size:.86rem}

.talk{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,5fr);gap:24px;align-items:start}

<script>
(function(){
"use strict";
const KEY='clerkship-docs-v1';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== state ===================== */
const newRefer=()=>({stage:'choose',choice:null,f:{},m:{},ink:{},ov:{},t0:null,t1:null});
const newRound=()=>({ck:{},fb:'',draw:null,t0:null,t1:null,choice:null,f:{},m:{},ink:{},ov:{}});
const newConsent=()=>({stage:'setup',names:['',''],round:0,rounds:[newRound(),newRound()],saved:false});
const defState=()=>({ui:{view:'home',finger:false,caseOpen:true},refer:newRefer(),consent:newConsent(),history:[]});
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null}
if(!S||!S.refer||!S.consent||!S.ui) S=defState();
if(!Array.isArray(S.history)) S.history=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let saveT=null; function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,350)}
function get(p){return p.split('.').reduce((o,k)=>o==null?undefined:o[k],S)}
function set(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}
const fid=p=>'f_'+p.replace(/[^a-zA-Z0-9]/g,'_');

/* ===================== text matching ===================== */
const N=s=>String(s||'').toLowerCase().replace(/[\s,:=]+/g,'').replace(/[°º˚]/g,'');
function hasNum(t,n){return new RegExp('(^|[^0-9.])'+n.replace(/\./g,'\\.')+'($|[^0-9])').test(t)}
function need(t,list){return list.filter(([label,p])=>!(p instanceof RegExp?p.test(t):hasNum(t,p))).map(x=>x[0])}
const filled=(v)=>String(v||'').trim().length>0;
const inkHas=(d)=>!!(d&&d.s&&d.s.length);

/* ===================== case data ===================== */
const CASE_TASK='ท่านเป็นแพทย์ใช้ทุนอยู่ที่ รพ.เขาสวนกวาง จงเขียนใบ Refer ส่งผู้ป่วยกลับไปรักษาต่อที่ รพ.ขอนแก่น';
const LABS=[
 ['CBC',[['Hb','12.3'],['Hct','37.2'],['Plt','222,000'],['WBC','2,900'],['PMN','92.7%'],['L','7%'],['M','0.2%'],['E','0.1%'],['B','0.1%']]],
 ['Chemistry',[['Cr','1.4'],['Na','138'],['K','3.7'],['Cl','102'],['HCO₃','19'],['Ca','8.9'],['Mg','1.4'],['PO₄','3.1']]],
 ['LFT',[['Chol','137'],['TP','7.3'],['Alb','3.2'],['Glob','4.1'],['TB','2.6'],['DB','1.8'],['ALT','115'],['AST','158'],['ALP','163']]],
 ['Coagulation',[['PT','16.2'],['PTT','38.5'],['INR','1.46']]]
];
function caseHTML(){
  return `
  <p class="task">${esc(CASE_TASK)}</p>
  <dl class="kv">
    <dt>วันที่</dt><dd>25 พ.ค. 51</dd>
    <dt>ผู้ป่วย</dt><dd>นายพร เพชรงาม · ชาย · อายุ 50 ปี</dd>
    <dt>ที่อยู่</dt><dd>12 หมู่ 5 ต.ฟ้าใส อ.เขาสวนกวาง จ.ขอนแก่น</dd>
    <dt>HN</dt><dd style="font-family:var(--mono)">4512/51</dd>
  </dl>
  <section><h3>ประวัติจากผู้ป่วย</h3>
    <div class="pi">
      <p><b>CC</b> ปวดท้องมา 3 วัน</p>
      <p><b>PI</b> <span class="when">3 วันก่อนมา รพ.</span> ปวดท้องใต้ชายโครงขวาและลิ้นปี่ ปวดจุกมาก ตลอดเวลา ไม่ร้าวไปที่ใด ไม่แสบ คลื่นไส้อาเจียน 2 ครั้ง ไม่มีถ่ายเหลว ปัสสาวะปกติ ไม่มีอาการตาเหลืองตัวเหลือง ทานอาหารได้ลดลง</p>
      <p><span class="when">1 วันก่อนมา รพ.</span> มีไข้สูงหนาวสั่น ร่วมกับอาการปวดท้องรุนแรงมากขึ้น</p>
    </div>
  </section>
  <section><h3>SR</h3>
    <ul><li>ไม่เป็นโรคเบาหวานและความดันโลหิตสูง</li><li>ไม่เคยแพ้ยา</li><li>ผอมลง แต่ไม่เคยชั่งน้ำหนัก</li><li>เลิกดื่มสุราและสูบบุหรี่มา 6 ปี</li></ul>
  </section>
  <section><h3>Physical examination</h3>
    <dl class="pe">
      <dt>GA</dt><dd>A middle age man looked distress</dd>
      <dt>V/S</dt><dd>BP 76/46 mmHg, PR 120 bpm, RR 22 /min, BT 39 °C</dd>
      <dt>HEENT</dt><dd>not pale conjunctivae, anicteric sclerae, CLN were impalpable</dd>
      <dt>Heart</dt><dd>tachycardia, no murmur</dd>
      <dt>Lungs</dt><dd>clear</dd>
      <dt>Ext.</dt><dd>no edema</dd>
      <dt>Abdomen</dt><dd>active bowel sound, marked tender at RUQ with rebound tenderness</dd>
      <dt>PR</dt><dd>yellowish feces, not tender, no rectal shelf</dd>
    </dl>
  </section>
  <section><h3>Lab</h3>
    ${LABS.map(([g,rows])=>`<div class="labgroup"><span>${g}</span><div class="labs">${rows.map(([k,v])=>`<div class="lab"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div>`).join('')}
  </section>
  <section><h3>Impression และการรักษาที่ให้แล้ว</h3>
    <p><b>Acute cholecystitis with septic shock</b> ได้ให้ 0.9% normal saline IV loading ไป 800 cc BP ขึ้นมาเป็น 90/60 mmHg · Start antibiotic เป็น ceftriaxone 2 g IV · retain NG tube และ retain Foley catheter แล้ว refer มารับการรักษาต่อ</p>
  </section>`;
}

/* ===================== refer rubric (from เฉลย) ===================== */
const LABELS={s1:'1. ประวัติการป่วยในอดีต และประวัติครอบครัว',s2:'2. ประวัติการป่วยปัจจุบัน',s3:'3. ผลการตรวจชันสูตรทางห้องทดลองที่สำคัญ',s4:'4. การวินิจฉัยโรคเบื้องต้น',s5:'5. การรักษาที่ได้ให้ไว้แล้ว',s6:'6. สาเหตุที่ส่ง',s7:'7. รายละเอียดอื่น ๆ',
  benefit:'ผลดีจากการรักษา',noTx:'ผลเสียจากไม่ได้รับการรักษา',risk:'ความเสี่ยงที่อาจเกิดขึ้น',alt:'แนวทางเลือกอื่น',altWhy:'สาเหตุที่ไม่เลือกวิธีอื่น'};
function kvShow(c,pairs){
  const rows=pairs.map(([l,k])=>`<dt>${esc(l)}</dt><dd>${filled(c.f[k])?esc(c.f[k]):'<span class="empty">ว่าง</span>'}</dd>`).join('');
  return `<div class="answer"><dl>${rows}</dl></div>`;
}
const REFER_ITEMS=[
 {id:'head',title:'หัวแบบฟอร์ม: วันที่ จาก ถึง',key:'ลงวันที่\nจาก รพ.เขาสวนกวาง\nถึง รพ.ขอนแก่น',
  show:c=>kvShow(c,[['วันที่',"d"],['เดือน','mo'],['พ.ศ.','y'],['จาก','from'],['ถึง','to']]),
  checks:[['ลงวันที่',(t,c)=>filled(c.f.d)||filled(c.f.mo)||filled(c.f.y)],
          ['จาก รพ.เขาสวนกวาง',(t,c)=>/เขาสวนกวาง/.test(N(c.f.from))],
          ['ถึง รพ.ขอนแก่น',(t,c)=>/ขอนแก่น|khonkaen/.test(N(c.f.to))]]},
 {id:'pt',title:'ข้อมูลผู้ป่วย',key:'นายพร เพชรงาม  H.N. 4512/51\nเพศชาย อายุ 50 ปี\nบ้านเลขที่ 12 หมู่ที่ 5 ต.ฟ้าใส อ.เขาสวนกวาง จ.ขอนแก่น',
  show:c=>kvShow(c,[['ชื่อ','name'],['H.N.','hn'],['เพศ','sex'],['อายุ','age'],['บ้านเลขที่','house'],['หมู่ที่','moo'],['ตำบล','tambon'],['อำเภอ','amphoe'],['จังหวัด','prov']]),
  checks:[['ชื่อ-สกุล นายพร เพชรงาม',(t,c)=>/พร/.test(N(c.f.name))&&/เพชรงาม/.test(N(c.f.name))],
          ['H.N. 4512/51',(t,c)=>/4512\/51/.test(N(c.f.hn))],
          ['เพศชาย อายุ 50 ปี',(t,c)=>{const m=[];if(!/ชาย|male|^m$/.test(N(c.f.sex)))m.push('เพศ');if(!hasNum(N(c.f.age),'50'))m.push('อายุ');return m}],
          ['ที่อยู่ 12 หมู่ 5 ต.ฟ้าใส อ.เขาสวนกวาง จ.ขอนแก่น',(t,c)=>{const m=[];if(!hasNum(N(c.f.house),'12'))m.push('บ้านเลขที่');if(!hasNum(N(c.f.moo),'5'))m.push('หมู่');if(!/ฟ้าใส/.test(N(c.f.tambon)))m.push('ตำบล');if(!/เขาสวนกวาง/.test(N(c.f.amphoe)))m.push('อำเภอ');if(!/ขอนแก่น/.test(N(c.f.prov)))m.push('จังหวัด');return m}]]},
 {id:'purpose',title:'มาเพื่อโปรด',key:'☑ รับไว้รักษาต่อ',
  show:c=>`<div class="answer">${[['p_admit','รับไว้รักษาต่อ'],['p_lab','ตรวจชันสูตร'],['p_obs','คุมไว้สังเกต'],['p_res','ขอทราบผล']].filter(([k])=>c.f[k]).map(([,l])=>'☑ '+l).join('\n')||'<span class="empty">ไม่ได้เลือก</span>'}</div>`,
  checks:[['เลือก "รับไว้รักษาต่อ"',(t,c)=>!!c.f.p_admit]]},
 {id:'pmh',title:'ประวัติการป่วยในอดีต และประวัติครอบครัว',sections:['s1'],key:'ผอมลง แต่ไม่เคยชั่งน้ำหนัก\nเลิกดื่มสุราและสูบบุหรี่มา 6 ปี',
  checks:[['ผอมลง / น้ำหนักลด',t=>/ผอม|น้ำหนักลด|weightloss|loseweight|losingweight/.test(t)],
          ['ประวัติดื่มสุรา',t=>/สุรา|เหล้า|แอลกอฮอล์|alcohol|drink/.test(t)],
          ['ประวัติสูบบุหรี่',t=>/บุหรี่|smok|cigar/.test(t)],
          ['เลิกมาแล้ว 6 ปี',t=>/6ปี|6yr|6year|หกปี/.test(t)]]},

/* ===================== rubric engine ===================== */
function ctxRefer(){const r=S.refer;return{scope:'refer',f:r.f,m:r.m,ink:r.ink,ov:r.ov,choice:r.first||r.choice}}
function ctxRound(i){const r=S.consent.rounds[i];return{scope:'consent.rounds.'+i,f:r.f,m:r.m,ink:r.ink,ov:r.ov,choice:r.first||r.choice,now:r.choice}}
function evalItem(it,c){
  const secs=it.sections||[];
  const text=N(secs.map(k=>c.m[k]==='ink'?'':(c.f[k]||'')).join(' '));
  const inkUsed=secs.some(k=>c.m[k]==='ink'&&inkHas(c.ink[k]));
  const res=it.checks.map(([label,fn])=>{const r=fn(text,c);const ok=r===true||(Array.isArray(r)&&r.length===0);return{label,ok,miss:Array.isArray(r)?r:[]}});
  const n=res.filter(r=>r.ok).length;
  let status=n===res.length?'pass':(inkUsed?'manual':(n?'partial':'miss'));
  if(status!=='pass'&&it.manualIf&&it.manualIf(c))status='manual';
  return{res,status,auto:status==='pass'?1:status==='manual'?null:0};
}
function tally(items,c){let s=0,p=0;items.forEach(it=>{const e=evalItem(it,c);const ov=c.ov[it.id];const v=ov!=null?ov:e.auto;if(v==null)p++;else s+=v});return{s,p,t:items.length}}
const STATUS={pass:'ครบตามเฉลย',partial:'ยังไม่ครบ',miss:'ไม่พบ',manual:'ตรวจด้วยตา'};
function showSections(it,c){
  return it.sections.map(k=>{
    const label=it.sections.length>1?`<p class="lbl">${esc(LABELS[k]||k)}</p>`:'';
    if(c.m[k]==='ink') return label+(inkHas(c.ink[k])?`<canvas class="thumb" data-thumb="${c.scope}.ink.${k}"></canvas>`:'<div class="answer"><span class="empty">ไม่ได้เขียน</span></div>');
    return label+`<div class="answer">${filled(c.f[k])?esc(c.f[k]):'<span class="empty">ไม่ได้เขียน</span>'}</div>`;
  }).join('');
}
function rubricHTML(items,c){
  return `<ol class="rubric">${items.map((it,i)=>{
    const e=evalItem(it,c);const ov=c.ov[it.id];const pts=ov!=null?ov:e.auto;
    return `<li class="item" data-status="${e.status}"><details${e.status!=='pass'?' open':''}><summary>
      <span class="ino">${i+1}</span><span class="ititle">${esc(it.title)}</span>
      <span class="pill ${e.status}">${STATUS[e.status]}</span>
      <span class="pts" role="group" aria-label="คะแนนข้อ ${i+1}">
        <button type="button" class="ptb" data-act="ov" data-arg="${c.scope}|${it.id}|0" aria-pressed="${pts===0}">0</button><button type="button" class="ptb" data-act="ov" data-arg="${c.scope}|${it.id}|1" aria-pressed="${pts===1}">1</button>

        <div><p class="lbl">เฉลย</p><div class="keytext">${esc(it.key)}</div></div>
        <ul class="checks">${e.res.map(r=>`<li class="${r.ok?'ok':'no'}"><span class="mk" aria-hidden="true">${r.ok?'✓':'✕'}</span><span>${esc(r.label)}${r.miss.length?`<small>ยังขาด: ${esc(r.miss.join(', '))}</small>`:''}</span></li>`).join('')}</ul>
        ${e.status==='manual'&&ov==null?`<p class="ovnote">ข้อนี้เขียนด้วยมือ ให้เทียบกับเฉลยแล้วแตะ 0 หรือ 1 ด้านบน</p>`:''}
        ${ov!=null&&ov!==e.auto?`<p class="ovnote">ปรับคะแนนเองแล้ว · <button type="button" class="linkbtn" data-act="ovClear" data-arg="${c.scope}|${it.id}">ใช้ผลตรวจอัตโนมัติ</button></p>`:''}
      </div></details></li>`}).join('')}</ol>`;

function inp(path,label,w,extra){const v=get(path);return `<label class="fl" style="--w:${w||'12rem'}">${label?`<span>${label}</span>`:''}<input class="dot" id="${fid(path)}" data-bind="${path}" value="${esc(v||'')}" autocomplete="off" ${extra||''}></label>`}
function inl(path,w,extra){const v=get(path);return `<input class="dot" style="width:${w||'10rem'};max-width:100%" id="${fid(path)}" data-bind="${path}" value="${esc(v||'')}" autocomplete="off" aria-label="${esc(extra||'')}">`}
function chk(path,label){return `<label class="opt"><input type="checkbox" id="${fid(path)}" data-bind="${path}" ${get(path)?'checked':''}> ${label}</label>`}
function rad(path,val,label){return `<label class="opt"><input type="radio" name="${fid(path)}" id="${fid(path)}_${val}" data-bind="${path}" value="${val}" ${get(path)===val?'checked':''}> ${label}</label>`}
function areaBody(scope,key,rows){

function inkpad(path,cls,h){
  return `<div class="inkpad ${cls||''}" data-ink="${path}" data-h="${h||200}">
    <div class="ink-surface"><canvas></canvas></div>
    <div class="ink-tools"><button type="button" class="btn sm ghost" data-act="inkUndo" data-arg="${path}">ย้อน</button><button type="button" class="btn sm ghost" data-act="inkClear" data-arg="${path}" data-confirm="แตะอีกครั้งเพื่อล้าง">ล้าง</button>${cls==='sig'?'':`<button type="button" class="btn sm ghost" data-act="inkGrow" data-arg="${path}">เพิ่มพื้นที่</button>`}<span class="muted">${cls==='board'?'วาดด้วยนิ้วหรือ Apple Pencil':'Apple Pencil เขียนได้ทันที'}</span></div></div>`;
}

/* ===================== ink engine ===================== */
const pads=new Map(); let penActive=false, penT=null;
function penColor(){return getComputedStyle(document.documentElement).getPropertyValue('--pen').trim()||'#1B4A99'}
function scrollParent(el){let p=el.parentElement;while(p){const s=getComputedStyle(p).overflowY;if((s==='auto'||s==='scroll')&&p.scrollHeight>p.clientHeight)return p;p=p.parentElement}return document.scrollingElement}
function drawStrokes(ctx,d,scale){
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=penColor();
  d.s.forEach(st=>{const p=st.pts;if(p.length<3)return;
    if(p.length===3){ctx.beginPath();ctx.fillStyle=ctx.strokeStyle;ctx.arc(p[0]*scale,p[1]*scale,1.4*scale,0,7);ctx.fill();return}
    for(let i=3;i<p.length;i+=3){ctx.beginPath();ctx.lineWidth=(st.pen?0.8+p[i+2]*2.6:2.2)*Math.max(scale,.5);ctx.moveTo(p[i-3]*scale,p[i-2]*scale);ctx.lineTo(p[i]*scale,p[i+1]*scale);ctx.stroke()}
  });
}
function sizePad(pad){
  const w=pad.cv.parentElement.clientWidth||300; if(!pad.d.w)pad.d.w=w;
  pad.scale=w/pad.d.w; const h=Math.round(pad.d.h*pad.scale); const dpr=window.devicePixelRatio||1;
  pad.cv.width=Math.round(w*dpr);pad.cv.height=Math.round(h*dpr);pad.cv.style.height=h+'px';
  pad.ctx.setTransform(dpr,0,0,dpr,0,0);redraw(pad);
}
function redraw(pad){pad.ctx.clearRect(0,0,pad.cv.width,pad.cv.height);drawStrokes(pad.ctx,pad.d,pad.scale)}
function commit(pad){set(pad.path,pad.d);saveSoon()}
function mountInk(root){
  $$('.inkpad',root).forEach(el=>{
    const path=el.dataset.ink, cv=el.querySelector('canvas');
    let d=get(path); if(!d||!Array.isArray(d.s)) d={w:0,h:+el.dataset.h||200,s:[]};
    const pad={el,cv,path,d,ctx:cv.getContext('2d'),cur:null,scroll:null,scale:1,board:el.classList.contains('board')};
    pads.set(path,pad); sizePad(pad);
    const pos=e=>{const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)/pad.scale*10)/10,Math.round((e.clientY-r.top)/pad.scale*10)/10,Math.round((e.pressure||.5)*100)/100]};
    cv.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch'&&penActive) {e.preventDefault();return}
      if(e.pointerType==='touch'&&!(S.ui.finger||pad.board)){pad.scroll={y:e.clientY,id:e.pointerId,sp:scrollParent(el)};try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
      if(e.pointerType==='pen'){penActive=true;clearTimeout(penT)}
      e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
      pad.cur={pen:e.pointerType==='pen',pts:pos(e)};pad.d.s.push(pad.cur);redrawLast(pad);
    });
    cv.addEventListener('pointermove',e=>{
      if(pad.scroll&&e.pointerId===pad.scroll.id){const dy=e.clientY-pad.scroll.y;pad.scroll.y=e.clientY;if(pad.scroll.sp)pad.scroll.sp.scrollTop-=dy;return}
      if(!pad.cur)return; e.preventDefault();
      const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
      (evs.length?evs:[e]).forEach(ev=>{const p=pos(ev);pad.cur.pts.push(p[0],p[1],p[2]);segment(pad)});
    });
    const end=e=>{pad.scroll=null;if(e.pointerType==='pen'){penT=setTimeout(()=>{penActive=false},600)}if(pad.cur){pad.cur=null;commit(pad)}};
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  });
}
function segment(pad){const st=pad.cur,p=st.pts,i=p.length-3;if(i<3)return;const c=pad.ctx,s=pad.scale;c.lineCap='round';c.strokeStyle=penColor();c.beginPath();c.lineWidth=(st.pen?0.8+p[i+2]*2.6:2.2)*Math.max(s,.5);c.moveTo(p[i-3]*s,p[i-2]*s);c.lineTo(p[i]*s,p[i+1]*s);c.stroke()}
function redrawLast(pad){const p=pad.cur.pts,c=pad.ctx,s=pad.scale;c.fillStyle=penColor();c.beginPath();c.arc(p[0]*s,p[1]*s,1.2*s,0,7);c.fill()}
function drawThumbs(root){
  $$('canvas.thumb',root).forEach(cv=>{const d=get(cv.dataset.thumb);if(!inkHas(d))return;const w=cv.clientWidth||300;const scale=w/d.w;const h=Math.round(d.h*scale);const dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);drawStrokes(ctx,d,scale)});
}
let rzT=null; window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{pads.forEach(sizePad);drawThumbs(document)},150)});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{pads.forEach(redraw);drawThumbs(document)})}catch(e){}

    ${area(sc,'alt','นอกจากนี้ข้าพเจ้าได้ทราบถึงแนวทางเลือกอื่น ๆ เพื่อการตรวจ/รักษา (ถ้ามี) โปรดระบุ',1)}
    ${area(sc,'altWhy','โดยมีสาเหตุที่ไม่เลือกรักษาด้วยวิธีทางเลือกอื่น ๆ คือ',1)}
    <div class="frow">${inp(P+'explainer','โดยรายละเอียดข้างต้น ได้ถูกอธิบายแก่ข้าพเจ้าอย่างชัดเจนโดย (ชื่อแพทย์/อาจารย์)','14rem')}</div>
    <p class="legal">ข้าพเจ้ามีสติตระหนักดีว่า คณะแพทย์และทีมผู้รักษาพยาบาล ไม่สามารถรับรองได้ถึงผลสำเร็จของการตรวจ/รักษาดังกล่าวทั้งหมดได้ ทั้งนี้ข้าพเจ้าขอแสดงความ</p>
    <div class="opts">${rad(P+'consent','yes','ยินยอม')}${rad(P+'consent','no','ไม่ยินยอม')}</div>
    <p class="legal">รับการตรวจ/รักษาด้วยวิธีดังกล่าว ถ้าแพทย์ผู้รักษามีความจำเป็นที่จะต้องทำหัตถการ หรือผ่าตัด หรือตรวจวิธีพิเศษเพื่อการเพิ่มเติมอย่างทันทีทันใด ข้าพเจ้ายินยอมให้แพทย์ดำเนินการได้โดยเป็นการคำนึงถึงประโยชน์ต่อสุขภาพอนามัยของผู้ป่วยตามความจำเป็นและเหมาะสม และ/หรือ ชีวิตของผู้ป่วยเป็นสำคัญ</p>
    <div class="sigblock">
      <div class="sigcol"><b>ลงชื่อ ผู้ให้ความยินยอม</b>${inkpad(sc+'.ink.pSig','sig',110)}${inp(P+'pName','(ชื่อตัวบรรจง)','12rem')}<div class="opts">${rad(P+'pAs','self','ผู้ป่วยเอง')}${rad(P+'pAs','kin','ญาติ*')}</div>${inp(P+'pRel','* ระบุความสัมพันธ์กับผู้ป่วย','10rem')}${inp(P+'pDate','วันที่','10rem')}</div>
      <div class="sigcol"><b>ลงชื่อ ผู้ให้ข้อมูลหัตถการ/การตรวจ–รักษาพิเศษ</b>${inkpad(sc+'.ink.dSig','sig',110)}${inp(P+'dName','(ชื่อตัวบรรจง)','12rem')}${inp(P+'dDate','วันที่','10rem')}</div>
    </div>
    <p class="legal">ขอรับรองว่าผู้ป่วยหรือผู้ตัดสินใจแทนผู้ป่วยได้ให้ความยินยอมหรือลงลายพิมพ์นิ้วมือต่อหน้าพยานจริง</p>
    <div class="frow">${inp(P+'w1','ลงชื่อ พยาน','12rem')}${inp(P+'w1r','ระบุ','8rem')}</div>
    <div class="frow">${inp(P+'w2','ลงชื่อ พยาน','12rem')}${inp(P+'w2r','ระบุ','8rem')}</div>
    <details><summary>กรณีผู้ป่วยไม่อาจให้ความยินยอมได้ด้วยตนเอง</summary>
      <div class="opts" style="padding-top:8px">${chk(P+'r_minor','อายุไม่เกินยี่สิบปีบริบูรณ์')}${chk(P+'r_dis','ผู้บกพร่องทางกาย–จิต')}${chk(P+'r_other','อื่น ๆ')}</div>
      ${inp(P+'r_note','ระบุ','14rem')}</details>
    <div class="paper-foot"><span>พ. 155</span><span>แบบฝึกหัด</span></div>
  </form>
  <div class="submit-row"><button type="button" class="btn primary lg" data-act="cGrade">ส่งตรวจรอบนี้</button><span class="muted">ส่งแล้วยังกลับมาแก้ไขได้</span></div>`;
  return `<div class="formcol">${html}</div>`;
}
function consentResult(){
  const i=S.consent.round, R=S.consent.rounds[i], c=ctxRound(i), s=ckScore(R), ft=tally(CONSENT_ITEMS,c);
  const missed=LEAVES.filter(x=>!R.ck[x.n]);
  const time=R.t0?fmtTime((R.t1||Date.now())-R.t0):'–';
  return `<div class="scorehead">
    <div class="bignum">${s}<small> / ${CK_TOTAL}</small></div>
    <div class="scoreinfo"><span class="verdict ${s>=PASS?'pass':'fail'}">${s>=PASS?'ผ่าน':'ยังไม่ผ่าน'} (เกณฑ์ ${PASS} คะแนน)</span><p class="muted">แพทย์ ${esc(nm(docIdx()))} · เวลาสนทนา ${time} · ใบยินยอมครบ ${ft.s}/${ft.t} ข้อ${ft.p?` (รอตรวจ ${ft.p})`:''}</p></div>
    <div class="row"><button type="button" class="btn primary" data-act="cNext">${i===0?'สลับบท เริ่มรอบที่ 2':'ดูสรุปทั้งคู่'}</button></div>
  </div>
  <div class="talk">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <h2 class="h-sec">ตรวจใบยินยอม</h2><p class="muted">ไม่รวมในคะแนน checklist ใช้ทบทวนว่ากรอกครบและถูกใบหรือไม่</p>
      ${rubricHTML(CONSENT_ITEMS,c)}
    </div>
    <aside class="side">
      <section class="panel"><h3>ข้อที่ยังไม่ได้อธิบาย (${missed.length})</h3>${missed.length?`<ul class="misslist">${missed.map(x=>`<li><span class="no">${x.n}</span><span>${esc(x.t)}</span></li>`).join('')}</ul>`:'<p>อธิบายครบทุกข้อ</p>'}<button type="button" class="btn sm" data-act="cStep" data-arg="1">กลับไปแก้ checklist</button></section>
      ${filled(R.fb)?`<section class="panel"><h3>ข้อเสนอแนะจากผู้ป่วย</h3><p style="white-space:pre-wrap">${esc(R.fb)}</p></section>`:''}
      ${inkHas(R.draw)?`<section class="panel"><h3>รูปที่วาดประกอบ</h3><canvas class="thumb" data-thumb="consent.rounds.${i}.draw"></canvas></section>`:''}
    </aside>
  </div>`;
}
function consentSummary(){
  const c=S.consent;
  const card=(i)=>{const R=c.rounds[i],s=ckScore(R),ft=tally(CONSENT_ITEMS,ctxRound(i));
    return `<section class="sumcard"><p class="eyebrow">รอบที่ ${i+1} · บทแพทย์</p><h2>${esc(nm(i))}</h2>
      <span class="verdict ${s>=PASS?'pass':'fail'}">${s>=PASS?'ผ่าน':'ยังไม่ผ่าน'}</span>
      <dl><dt>Checklist</dt><dd>${s} / ${CK_TOTAL}</dd><dt>ใบยินยอมครบ</dt><dd>${ft.s} / ${ft.t}</dd><dt>เลือกใบยินยอม (ครั้งแรก)</dt><dd>${(R.first||R.choice)==='proc'?'ถูกใบ':'ผิดใบ'}</dd><dt>เวลาสนทนา</dt><dd>${R.t0?fmtTime((R.t1||Date.now())-R.t0):'–'}</dd></dl>
      <button type="button" class="btn sm" data-act="cOpenRound" data-arg="${i}">ดูรายละเอียดรอบนี้</button></section>`};
  return `<div class="cwrap narrow">
    <div class="intro"><p class="eyebrow">สรุปทั้งคู่</p><h1>${esc(nm(0))} และ ${esc(nm(1))}</h1><p class="muted">บันทึกผลไว้ในประวัติบนเครื่องนี้แล้ว</p></div>
    <div class="sumgrid">${card(0)}${card(1)}</div>
    <div class="row"><button type="button" class="btn primary" data-act="cNew" data-confirm="แตะอีกครั้งเพื่อล้างข้อมูลคู่นี้">เริ่มคู่ใหม่</button><button type="button" class="btn" data-act="go" data-arg="home">กลับหน้าแรก</button></div>
  </div>`;
}

/* ===================== render & events ===================== */
const view=$('#view');
let lastKey='';
function viewKey(){const v=S.ui.view;return v==='refer'?'refer:'+S.refer.stage:v==='consent'?'consent:'+S.consent.stage+':'+S.consent.round:'home'}
function render(keepScroll){
  const key=viewKey();const same=keepScroll!==false&&key===lastKey;
  const sc=same?$$('main, .pane').map(el=>el.scrollTop):null;
  pads.clear();
  view.innerHTML=S.ui.view==='refer'?referView():S.ui.view==='consent'?consentView():homeView();
  lastKey=key;
  mountInk(view);$$('textarea.ruled',view).forEach(grow);drawThumbs(view);
  if(sc){$$('main, .pane').forEach((el,i)=>{if(sc[i]!=null)el.scrollTop=sc[i]})}else{$$('main, .pane').forEach(el=>el.scrollTop=0)}
  const crumb=$('#crumb');const labels={refer:'ใบ Refer',consent:'Informed consent'};
  crumb.hidden=!labels[S.ui.view];crumb.textContent=labels[S.ui.view]||'';
  const writing=(S.ui.view==='refer'&&S.refer.stage==='write')||(S.ui.view==='consent'&&S.consent.stage==='form');
  $('#fingerSw').hidden=!writing;$('#fingerToggle').checked=!!S.ui.finger;
  tick();save();
}
function grow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,parseFloat(getComputedStyle(t).minHeight)||0)+'px'}
function tick(){
  const el=$('#timer');let t0=null,t1=null;
  if(S.ui.view==='refer'&&S.refer.stage!=='choose'){t0=S.refer.t0;t1=S.refer.t1}
  else if(S.ui.view==='consent'&&['talk','form','result'].includes(S.consent.stage)){const R=S.consent.rounds[S.consent.round];t0=R.t0;t1=R.t1}
  el.hidden=!t0; if(t0) el.textContent='เวลา '+fmtTime((t1||Date.now())-t0);
}
setInterval(tick,1000);
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open)drawThumbs(e.target)},true);
let toastT=null;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

document.addEventListener('input',onField);document.addEventListener('change',onField);
function onField(e){
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  if(el.type==='checkbox')set(b,el.checked);
  else if(el.type==='radio'){if(el.checked)set(b,el.value)}
  else set(b,el.value);
  if(el.tagName==='TEXTAREA'&&el.classList.contains('ruled'))grow(el);
  saveSoon();
}
const ACT={
  go(a){S.ui.view=a;render(false)},
  toggleCase(){S.ui.caseOpen=S.ui.caseOpen===false;render()},
  referStep(a){const st=['choose','write','result'][+a];if(st==='write'&&!S.refer.choice)return;if(st==='write'){if(!S.refer.t0)S.refer.t0=Date.now();S.refer.t1=null}if(st==='result')S.refer.t1=S.refer.t1||Date.now();S.refer.stage=st;render(false)},
  referChoose(a){if(!S.refer.first)S.refer.first=a;S.refer.choice=a;render()},
  referToForm(){S.refer.stage='write';if(!S.refer.t0)S.refer.t0=Date.now();if(S.ui.caseOpen===undefined)S.ui.caseOpen=true;render(false)},
  referGrade(){S.refer.stage='result';S.refer.t1=Date.now();render(false)},
  referEdit(){S.refer.stage='write';S.refer.t1=null;render(false)},
  referReset(){S.refer=newRefer();render(false)},
  referSave(){const t=tally(REFER_ITEMS,ctxRefer());S.history.push({type:'refer',at:Date.now(),s:t.s,t:t.t,p:t.p,name:S.refer.f.signName||''});save();toast(t.p?'บันทึกแล้ว (ยังมีข้อรอตรวจ '+t.p+' ข้อ)':'บันทึกผลแล้ว')},
  ov(a){const [sc,id,v]=a.split('|');set(sc+'.ov.'+id,+v);render()},
  ovClear(a){const [sc,id]=a.split('|');const o=get(sc+'.ov');if(o)delete o[id];render()},
  mode(a,btn){const sec=btn.closest('.sec');const sc=sec.dataset.scope,k=sec.dataset.key;set(sc+'.m.'+k,a);
    $$('button',btn.parentElement).forEach(b=>b.setAttribute('aria-pressed',b.dataset.arg===a));
    const body=$('.sec-body',sec);body.innerHTML=areaBody(sc,k,+sec.dataset.rows||3);mountInk(body);$$('textarea.ruled',body).forEach(grow);saveSoon()},
  inkUndo(a){const p=pads.get(a);if(!p)return;p.d.s.pop();redraw(p);commit(p)},
  inkClear(a){const p=pads.get(a);if(!p)return;p.d.s=[];redraw(p);commit(p)},
  inkGrow(a){const p=pads.get(a);if(!p)return;p.d.h+=140;sizePad(p);commit(p)},
  ck(a,btn){const R=S.consent.rounds[S.consent.round];R.ck[a]=!R.ck[a];btn.setAttribute('aria-pressed',!!R.ck[a]);
    const s=ckScore(R);$('#sbNum').innerHTML=`${s}<small> / ${CK_TOTAL}</small>`;$$('#scorebar .seg').forEach((el,i)=>el.classList.toggle('on',i<s));$('#sbPass').textContent=s>=PASS?'ถึงเกณฑ์ผ่านแล้ว':'ผ่านที่ '+PASS+' คะแนน';saveSoon()},
  cStart(){S.consent.stage='brief';S.consent.round=0;render(false)},
  cStep(a){const st=['brief','talk','form','result'][+a];const R=S.consent.rounds[S.consent.round];if(st==='talk'&&!R.t0)R.t0=Date.now();S.consent.stage=st;render(false)},
  cTalk(){const R=S.consent.rounds[S.consent.round];if(!R.t0)R.t0=Date.now();R.t1=null;S.consent.stage='talk';render(false)},
  cToForm(){const R=S.consent.rounds[S.consent.round];if(!R.t1)R.t1=Date.now();S.consent.stage='form';render(false)},
  cChoose(a){const R=S.consent.rounds[S.consent.round];if(!R.first)R.first=a;R.choice=a;render()},
  cGrade(){const R=S.consent.rounds[S.consent.round];R.graded=true;if(!R.t1)R.t1=Date.now();S.consent.stage='result';render(false)},
  cNext(){const c=S.consent;if(c.round===0){c.round=1;c.stage='brief'}else{c.stage='summary';if(!c.saved){c.saved=true;S.history.push({type:'consent',at:Date.now(),a:nm(0),b:nm(1),sa:ckScore(c.rounds[0]),sb:ckScore(c.rounds[1])})}}render(false)},
  cOpenRound(a){S.consent.round=+a;S.consent.stage='result';render(false)},
  cNew(){S.consent=newConsent();render(false)}
};
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');if(!btn)return;
  if(btn.closest('summary'))e.preventDefault();
  if(btn.disabled)return;
  if(btn.dataset.confirm&&!btn.dataset.armed){const orig=btn.textContent;btn.dataset.armed='1';btn.textContent=btn.dataset.confirm;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=orig}},3000);return}
  const fn=ACT[btn.dataset.act];if(fn)fn(btn.dataset.arg,btn);
});
render(false);
})();
</script>

</body>
</html>
